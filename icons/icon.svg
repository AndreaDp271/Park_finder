      <stop offset="0" stop-color="#3b82f6"/>
      <stop offset="1" stop-color="#1d4ed8"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="5.5" fill="url(#g)"/>
  <path d="M9 17V7h4a3 3 0 0 1 0 6H9" transform="translate(12 12) scale(1.32) translate(-12.5 -12)"
