<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <title>ParkMap - OSM Parking</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#ffffff" />

  <!-- PWA / "Aggiungi a Home" -->
  <link rel="manifest" href="manifest.json" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="ParkMap" />
  <link rel="apple-touch-icon" href="icon-192.png" />

  <link rel="icon" type="image/svg+xml" sizes="any"
    href="data:image/svg+xml,%3Csvg%20xmlns%3D%27http%3A//www.w3.org/2000/svg%27%20viewBox%3D%270%200%2024%2024%27%3E%3Crect%20width%3D%2724%27%20height%3D%2724%27%20fill%3D%27%23ffffff%27/%3E%3Cg%20fill%3D%27none%27%20stroke%3D%27%233b82f6%27%20stroke-width%3D%272%27%20stroke-linecap%3D%27round%27%20stroke-linejoin%3D%27round%27%3E%3Crect%20x%3D%273%27%20y%3D%273%27%20width%3D%2718%27%20height%3D%2718%27%20rx%3D%272%27/%3E%3Cpath%20d%3D%27M9%2017V7h4a3%203%200%200%201%200%206H9%27/%3E%3C/g%3E%3C/svg%3E" />

  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
        integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root{
      --primary:#3b82f6;
      --primary-dark:#2563eb;
      --primary-light:#eff6ff;
      --bg-dark:#0f172a;
      --text-main:#1e293b;
      --text-light:#64748b;
      --radius:12px;
      --shadow-sm:0 1px 2px 0 rgb(0 0 0 / 0.05);
      --shadow-md:0 4px 6px -1px rgb(0 0 0 / 0.1),0 2px 4px -2px rgb(0 0 0 / 0.1);
      --shadow-lg:0 10px 15px -3px rgb(0 0 0 / 0.1),0 4px 6px -4px rgb(0 0 0 / 0.1);
      --glass:rgba(255,255,255,0.85);
      --danger:#ef4444;
      --meter-fill:#f97316;
      --meter-stroke:#111827;
      --btn-size:46px;
      --btn-gap:10px;
      --btn-shadow:0 2px 10px rgb(15 23 42 / 0.10),0 1px 2px rgb(15 23 42 / 0.08);
      --btn-border:1px solid rgba(15,23,42,0.06);
    }

    html,body{
      height:100%;
      margin:0;
      padding:0;
      overflow:hidden;
      font-family:'Inter',system-ui,-apple-system,sans-serif;
      background:#f8fafc;
      -webkit-tap-highlight-color:transparent;
    }

    #map{
      position:absolute;
      top:0;bottom:0;left:0;right:0;
      z-index:1;
    }

    #topbar{
      position:fixed;
      top:12px;
      left:50%;
      transform:translateX(-50%);
      width:calc(100% - 24px);
      max-width:600px;
      z-index:1000;
      display:flex;
      align-items:center;
      gap:10px;
      pointer-events:none;
    }
    #topbar > *{ pointer-events:auto; box-shadow:var(--btn-shadow); }

    #titleBadge{
      background:var(--glass);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border:var(--btn-border);
      color:var(--text-main);
      height:46px;
      padding:0 16px;
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      gap:8px;
      font-weight:700;
      font-size:15px;
      white-space:nowrap;
      flex-shrink:0;
    }
    #titleBadge i{ color:var(--primary); width:19px; height:19px; }

    #searchBox{
      flex:1;
      background:var(--glass);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      border:var(--btn-border);
      height:46px;
      border-radius:var(--radius);
      display:flex;
      align-items:center;
      padding:0 4px 0 16px;
      transition:transform .2s ease, box-shadow .2s ease;
      position:relative;
    }
    #searchBox:focus-within{
      box-shadow:var(--shadow-md),0 0 0 2px var(--primary);
      transform:translateY(-1px);
    }

    #searchInput{
      flex:1;
      border:none;
      background:transparent;
      font-family:inherit;
      font-size:14px;
      color:var(--text-main);
      outline:none;
      min-width:0;
      padding:0;
    }
    #searchInput::placeholder{ color:#94a3b8; }

    #searchBtn{
      background:var(--primary);
      color:#fff;
      height:36px;
      padding:0 14px;
      border-radius:8px;
      font-weight:600;
      font-size:13px;
      border:none;
      cursor:pointer;
      display:flex;
      align-items:center;
      gap:6px;
      margin-left:8px;
      transition:background .15s ease, transform .15s ease;
    }
    #searchBtn:hover{ background:var(--primary-dark); }
    #searchBtn:active{ transform:scale(0.95); }

    #searchResults{
      position:absolute;
      left:0;right:0;
      top:calc(100% + 8px);
      background:#fff;
      border-radius:14px;
      box-shadow:var(--shadow-lg);
      overflow:hidden;
      display:none;
      z-index:2000;
      border:1px solid #e2e8f0;
    }
    .search-result-item{
      padding:10px 12px;
      font-size:14px;
      cursor:pointer;
      color:var(--text-main);
      background:#fff;
    }
    .search-result-item:hover{ background:#f8fafc; }
    .search-result-item + .search-result-item{ border-top:1px solid #f1f5f9; }

    .fab-btn{
      position:fixed;
      z-index:1001;
      background:var(--glass);
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      color:var(--text-main);
      width:var(--btn-size);height:var(--btn-size);
      border-radius:50%;
      box-shadow:var(--btn-shadow);
      border:var(--btn-border);
      display:flex;
      align-items:center;
      justify-content:center;
      cursor:pointer;
      transition:transform .2s cubic-bezier(0.34,1.56,0.64,1), color .15s ease;
    }
    .fab-btn i{ width:20px; height:20px; }
    .fab-btn:hover{ transform:scale(1.06); color:var(--primary); }
    .fab-btn:active{ transform:scale(0.94); }

    /* Allinea i controlli nativi di Leaflet (zoom, layer) allo stile dei pulsanti flottanti */
    .leaflet-bottom.leaflet-left{ margin:0 0 16px 16px; }
    .leaflet-bottom .leaflet-control{ margin:0 0 var(--btn-gap) 0 !important; }
    .leaflet-control-zoom{ border:none !important; background:transparent !important; box-shadow:none !important; border-radius:0 !important; display:flex; flex-direction:column; gap:var(--btn-gap); }
    .leaflet-control-zoom a{
      width:var(--btn-size) !important; height:var(--btn-size) !important; line-height:var(--btn-size) !important;
      border-radius:50% !important;
      background:var(--glass) !important;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:var(--btn-shadow);
      border:var(--btn-border) !important;
      color:var(--text-main) !important;
      font-size:19px;
      transition:transform .2s cubic-bezier(0.34,1.56,0.64,1), color .15s ease;
    }
    .leaflet-control-zoom a:hover{ background:var(--glass) !important; color:var(--primary) !important; transform:scale(1.06); }
    .leaflet-control-zoom a:active{ transform:scale(0.94); }

    .leaflet-control-layers{
      border:none !important;
      box-shadow:none !important;
      background:transparent !important;
    }
    .leaflet-control-layers-toggle{
      width:var(--btn-size) !important; height:var(--btn-size) !important;
      border-radius:50% !important;
      background-color:var(--glass) !important;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:var(--btn-shadow);
      border:var(--btn-border) !important;
      background-size:20px 20px !important;
      transition:transform .2s cubic-bezier(0.34,1.56,0.64,1);
    }
    .leaflet-control-layers-toggle:hover{ transform:scale(1.06); }

    /* Sposta la scritta Leaflet/OpenStreetMap in basso al centro, così non finisce sotto il pulsante info */
    .leaflet-control-attribution{
      position:fixed !important;
      left:50% !important;
      right:auto !important;
      bottom:4px !important;
      transform:translateX(-50%);
      background:rgba(255,255,255,0.75) !important;
      border-radius:8px;
      font-size:10px;
      padding:2px 8px;
      box-shadow:none;
    }

    .leaflet-control-layers-expanded{
      border-radius:16px !important;
      background:var(--glass) !important;
      backdrop-filter:blur(10px);
      -webkit-backdrop-filter:blur(10px);
      box-shadow:var(--btn-shadow);
      border:var(--btn-border) !important;
      padding:12px 16px !important;
      color:var(--text-main);
    }

    #status{
      position:fixed;
      bottom:30px;
      left:50%;
      transform:translateX(-50%) translateY(20px);
      background:rgba(15,23,42,.9);
      backdrop-filter:blur(4px);
      color:#fff;
      padding:12px 24px;
      border-radius:30px;
      font-size:14px;
      font-weight:500;
      z-index:2000;
      box-shadow:0 10px 25px -5px rgba(0,0,0,0.3);
      pointer-events:none;
      opacity:0;
      transition:all .3s cubic-bezier(0.16,1,0.3,1);
      display:flex;
      align-items:center;
      gap:8px;
      white-space:nowrap;
    }
    #status:not(:empty){ opacity:1; transform:translateX(-50%) translateY(0); }

    /* Pulsanti flottanti impilati sul lato destro (a sinistra restano zoom/layer di Leaflet) */
    #toggleLegend{ bottom:16px; right:16px; }
    #fullscreenBtn{ bottom:calc(16px + (var(--btn-size) + var(--btn-gap)) * 1); right:16px; }
    #refreshBtn{ bottom:calc(16px + (var(--btn-size) + var(--btn-gap)) * 2); right:16px; }
    #gpsBtn{ bottom:calc(16px + (var(--btn-size) + var(--btn-gap)) * 3); right:16px; }

    #legendPanel{
      position:fixed;
      bottom:calc(16px + (var(--btn-size) + var(--btn-gap)) * 1);
      right:16px;
      width:280px;
      max-width:calc(100% - 40px);
      max-height:60vh;
      background:#fff;
      border-radius:24px;
      box-shadow:var(--shadow-lg);
      z-index:1000;
      overflow-y:auto;
      display:none;
      animation:slideUp .3s cubic-bezier(0.16,1,0.3,1);
    }
    @keyframes slideUp{
      from{ opacity:0; transform:translateY(20px) scale(0.95); }
      to{ opacity:1; transform:translateY(0) scale(1); }
    }

    .legend-header{
      padding:16px 20px;
      border-bottom:1px solid #f1f5f9;
      font-weight:700;
      display:flex;
      justify-content:space-between;
      align-items:center;
      font-size:16px;
      color:var(--bg-dark);
      position:sticky;
      top:0;
      background:#fff;
    }
    .legend-section{ padding:16px 20px; }
    .legend-section-title{
      font-size:11px;
      text-transform:uppercase;
      letter-spacing:.08em;
      color:var(--text-light);
      margin-bottom:12px;
      font-weight:800;
    }
    .legend-item{
      display:flex;
      align-items:center;
      margin-bottom:10px;
      font-size:14px;
      font-weight:500;
      color:var(--text-main);
    }
    .legend-color{
      width:14px;height:14px;
      border-radius:4px;
      margin-right:12px;
      flex-shrink:0;
    }

    @keyframes popIn{ from{ opacity:0; transform:scale(0.92); } to{ opacity:1; transform:scale(1); } }
    .leaflet-popup-content-wrapper{
      border-radius:22px;
      box-shadow:0 20px 40px -12px rgb(15 23 42 / 0.25),0 4px 12px -4px rgb(15 23 42 / 0.1);
      padding:0; overflow:hidden;
      animation:popIn .18s cubic-bezier(0.34,1.56,0.64,1);
    }
    .leaflet-popup-content{ margin:0; min-width:250px !important; }
    .leaflet-popup-tip{ box-shadow:0 4px 10px rgb(15 23 42 / 0.15); }
    .leaflet-container a.leaflet-popup-close-button{
      top:14px; right:14px; color:#fff; font-size:18px; font-family:inherit;
      width:24px; height:24px; padding:0; margin:0;
      display:flex; align-items:center; justify-content:center;
      line-height:1;
      background:rgba(255,255,255,0.18); border-radius:50%;
    }
    .leaflet-container a.leaflet-popup-close-button span{ display:block; transform:translateY(-1px); }
    .leaflet-container a.leaflet-popup-close-button:hover{ background:rgba(255,255,255,0.32); color:#fff; }

    .popup-header-container{
      display:flex;
      align-items:center;
      gap:14px;
      margin:0;
      padding:18px 20px;
      background:linear-gradient(135deg, var(--primary), var(--primary-dark));
      transition:background .2s ease;
    }
    .popup-icon-box{
      background:rgba(255,255,255,0.2);
      color:#fff;
      width:44px;height:44px;
      border-radius:13px;
      display:flex;
      align-items:center;
      justify-content:center;
      flex-shrink:0;
      box-shadow:inset 0 0 0 1px rgba(255,255,255,0.25);
    }
    .popup-icon-box i{ width:22px; height:22px; }
    .popup-title{
      font-size:16px;
      font-weight:700;
      color:#fff;
      line-height:1.3;
    }
    .leaflet-popup-content > div:not(.popup-header-container):not(.popup-links){ padding:0 20px; }
    .leaflet-popup-content > .popup-header-container + *{ margin-top:18px; }
    .popup-section{ margin-bottom:14px; padding-bottom:14px; display:flex; flex-direction:column; border-bottom:1px solid #f1f5f9; }
    .popup-section:last-of-type{ margin-bottom:4px; padding-bottom:0; border-bottom:none; }
    .label{
      color:var(--text-light);
      font-weight:700;
      font-size:10.5px;
      text-transform:uppercase;
      letter-spacing:.07em;
      margin-bottom:4px;
    }
    .val{ color:var(--text-main); font-weight:600; font-size:14.5px; line-height:1.55; }

    .badge-note{
      background:var(--primary-light);
      color:var(--primary-dark);
      font-size:12px;
      padding:6px 11px;
      border-radius:20px;
      margin-top:6px;
      margin-right:6px;
      font-weight:700;
      display:inline-block;
      transition:transform .15s ease;
    }
    .badge-note.danger{ background:#fef2f2; color:var(--danger); }
    .badge-note.time{
      background:#f3e8ff;
      color:#6d28d9;
      border:1px solid #e9d5ff;
    }

    .popup-links{ display:grid; grid-template-columns:1fr 1fr; gap:10px; margin:16px 20px 20px; }
    .popup-links a{
      text-align:center;
      padding:11px;
      background:#f8fafc;
      border:1px solid #e2e8f0;
      border-radius:12px;
      text-decoration:none;
      font-weight:600;
      font-size:12px;
      color:var(--text-main);
      transition:all .15s ease;
    }
    .popup-links a:hover{ background:var(--primary); color:#fff; border-color:var(--primary); transform:translateY(-1px); }

    @media (max-width:600px){
      :root{ --btn-size:42px; --btn-gap:8px; }
      #topbar{ top:10px; width:calc(100% - 20px); gap:8px; }
      #titleBadge span{ display:none; }
      #titleBadge{ padding:0; width:46px; justify-content:center; }
      #searchBtn span.text{ display:none; }
      #searchBtn{ padding:0; width:36px; height:36px; justify-content:center; margin-left:4px; }
      #searchBox{ padding-left:12px; padding-right:6px; }
      #legendPanel{ left:16px; right:16px; width:auto; }
      #toggleLegend, #fullscreenBtn, #refreshBtn, #gpsBtn{ right:12px; }
      .leaflet-bottom.leaflet-left{ margin:0 0 12px 12px; }
    }
  </style>
</head>

<body>
  <div id="topbar">
    <div id="titleBadge" title="ParkMap"><i data-lucide="square-parking"></i> <span>ParkMap</span></div>

    <div id="searchBox">
      <input id="searchInput" type="text" placeholder="Cerca località..." aria-label="Cerca località" />
      <button id="searchBtn">
        <i data-lucide="search" style="width: 18px; height: 18px;"></i>
        <span class="text">Cerca</span>
      </button>
      <div id="searchResults"></div>
    </div>
  </div>

  <div id="map"></div>
  <div id="status"></div>

  <button id="gpsBtn" class="fab-btn" title="La mia posizione">
    <i data-lucide="locate-fixed"></i>
  </button>

  <button id="refreshBtn" class="fab-btn" title="Aggiorna dati">
    <i data-lucide="refresh-cw"></i>
  </button>

  <button id="fullscreenBtn" class="fab-btn" title="Schermo intero">
    <i data-lucide="maximize-2"></i>
  </button>

  <button id="toggleLegend" class="fab-btn" title="Legenda">
    <i data-lucide="info"></i>
  </button>

  <div id="legendPanel">
    <div class="legend-header">
      Legenda Mappa
      <i data-lucide="x" style="cursor:pointer; width: 20px;" id="closeLegend"></i>
    </div>

    <div class="legend-section">
      <div class="legend-section-title">Aree di Sosta</div>
      <div class="legend-item"><div class="legend-color" style="background:#60a5fa; border:1px solid #1d4ed8;"></div>Pagamento</div>
      <div class="legend-item"><div class="legend-color" style="background:#4ade80; border:1px solid #15803d;"></div>Gratuito</div>
      <div class="legend-item"><div class="legend-color" style="background:#a78bfa; border:1px solid #7c3aed;"></div>Disco orario</div>
      <div class="legend-item"><div class="legend-color" style="background:#fb923c; border:1px solid #ea580c;"></div>Limitato/Privato</div>
      <div class="legend-item"><div class="legend-color" style="background:#94a3b8; border:1px solid #64748b;"></div>Non specificato</div>
    </div>

    <div class="legend-section" style="background:#f8fafc">
      <div class="legend-section-title">Stalli Speciali</div>
      <div class="legend-item"><div class="legend-color" style="background:#fde047; border:1px solid #eab308;"></div>Disabili</div>
      <div class="legend-item"><div class="legend-color" style="background:#f0f9ff; border:1px solid #0284c7;"></div>Ricarica EV</div>
      <div class="legend-item"><div class="legend-color" style="background:#fed7aa; border:1px solid #d97706;"></div>Carico/Scarico</div>
      <div class="legend-item"><div class="legend-color" style="background:#fbcfe8; border:1px solid #db2777;"></div>Famiglie/Rosa</div>
    </div>

    <div class="legend-section">
      <div class="legend-section-title">Parcometri</div>
      <div class="legend-item"><div class="legend-color" style="background:var(--meter-fill); border:1px solid var(--meter-stroke);"></div>Parcometro (ticket)</div>
    </div>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
          integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
          crossorigin=""></script>

  <script>
    lucide.createIcons();

    function toggleLegend() {
      const lp = document.getElementById('legendPanel');
      lp.style.display = (lp.style.display === 'block' ? 'none' : 'block');
    }

    document.getElementById('toggleLegend').onclick = toggleLegend;
    document.getElementById('closeLegend').onclick = toggleLegend;

    var map = L.map('map', { zoomControl: false }).setView([45.4642, 9.19], 15);
    L.control.zoom({ position: 'bottomleft' }).addTo(map);

    L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
      maxZoom: 20,
      attribution: '&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank">OpenStreetMap</a>'
    }).addTo(map);

    // Le icone dei popup sono create dinamicamente: vanno renderizzate ogni volta che si aprono
    map.on('popupopen', (e) => lucide.createIcons({ root: e.popup._contentNode }));

    map.createPane('parkingAreasPane');
    map.getPane('parkingAreasPane').style.zIndex = 410;

    map.createPane('parkingSpacesPane');
    map.getPane('parkingSpacesPane').style.zIndex = 420;

    /* ✅ Parcometri */
    map.createPane('parkometersPane');
    map.getPane('parkometersPane').style.zIndex = 430;

    var parkingAreasLayer = L.layerGroup().addTo(map);
    var parkingSpacesLayer = L.layerGroup().addTo(map);
    var parkometersLayer = L.layerGroup().addTo(map);
	var loadedIds = new Set();
	var idToLayer = new Map(); // uniqueId -> { layer, group, lat, lon }

    L.control.layers(null, {
      "Aree di sosta": parkingAreasLayer,
      "Stalli speciali": parkingSpacesLayer,
      "Parcometri": parkometersLayer
    }, { collapsed: true, position: 'bottomleft' }).addTo(map);

    var statusEl = document.getElementById('status');
    function setStatus(msg) {
      statusEl.innerHTML = msg ? `<i data-lucide="info" style="width:16px"></i> ${msg}` : '';
      if (msg) lucide.createIcons({ root: statusEl });
    }

    function escapeHtml(s) {
      return (s || '')
        .replace(/&/g,'&amp;')
        .replace(/</g,'&lt;')
        .replace(/>/g,'&gt;')
        .replace(/"/g,'&quot;')
        .replace(/'/g,'&#039;');
    }

    function buildGMapsUrl(lat, lon) {
      return 'https://www.google.com/maps?q=' + encodeURIComponent(lat + ',' + lon);
    }

    function buildIdUrl(osmType, osmId, lat, lon, zoom) {
      zoom = zoom || map.getZoom() || 18;
      var base = 'https://www.openstreetmap.org/edit?editor=id';
      var center = '#map=' + zoom + '/' + lat + '/' + lon;
      var sel = (osmType && osmId) ? '&' + osmType + '=' + osmId : '';
      return base + sel + center;
    }

    // Come str.split(';'), ma ignora i ';' dentro le parentesi: un valore come
    // "no @ (Mo-Sa 13:00-15:00,20:00-08:00; Su)" è UNA sola regola condizionale,
    // non due, anche se contiene un punto e virgola nell'elenco giorni tra parentesi.
    function splitOsmRules(str) {
      const parts = [];
      let depth = 0, current = '';
      for (const ch of String(str || '')) {
        if (ch === '(') depth++;
        if (ch === ')') depth--;
        if (ch === ';' && depth <= 0) {
          parts.push(current);
          current = '';
        } else {
          current += ch;
        }
      }
      if (current.trim()) parts.push(current);
      return parts.map(p => p.trim()).filter(Boolean);
    }

    function translateOsmTime(str) {
      if (!str) return '';
      return str
        .replace(/Mo/g, 'Lun').replace(/Tu/g, 'Mar').replace(/We/g, 'Mer')
        .replace(/Th/g, 'Gio').replace(/Fr/g, 'Ven')
        .replace(/Sa/g, 'Sab')
        .replace(/Su/g, 'Dom').replace(/PH/g, 'Festivi')
        .replace(/off/g, 'chiuso').replace(/24\/7/g, 'sempre aperto');
    }

    function maxstayValueToItalian(v) {
      const raw = String(v || '').trim();
      const s = raw.toLowerCase();

      if (!raw) return '';
      if (['no', 'none', 'unlimited'].includes(s)) return 'senza limite';

      const m = s.match(/^(\d+(?:[.,]\d+)?)\s*(hour|hours|minute|minutes|day|days|week|weeks|month|months|year|years)$/);
      if (!m) return raw;

      const numStr = m[1];
      const num = parseFloat(numStr.replace(',', '.'));
      const one = Math.abs(num - 1) < 1e-9;
      const unit = m[2];

      if (unit === 'hour' || unit === 'hours') return one ? '1 ora' : `${numStr} ore`;
      if (unit === 'minute' || unit === 'minutes') return one ? '1 minuto' : `${numStr} minuti`;
      if (unit === 'day' || unit === 'days') return one ? '1 giorno' : `${numStr} giorni`;
      if (unit === 'week' || unit === 'weeks') return one ? '1 settimana' : `${numStr} settimane`;
      if (unit === 'month' || unit === 'months') return one ? '1 mese' : `${numStr} mesi`;
      if (unit === 'year' || unit === 'years') return one ? '1 anno' : `${numStr} anni`;

      return raw;
    }

    // Analizza una regola OSM del tipo "valore @ (condizione)" (usata da fee/access/maxstay
    // :conditional) restituendo il valore e la condizione tradotta, oppure null se non riconosciuta.
    function parseConditionalRule(rule) {
      let m = rule.match(/^(.+?)\s*@\s*\((.+)\)\s*$/);
      if (!m) m = rule.match(/^(.+?)\s*@\s*(.+?)\s*$/);
      if (!m) return null;
      return { value: m[1].trim(), condition: translateOsmTime(m[2]).trim() };
    }

    function formatMaxstayConditionalItalian(str) {
      return splitOsmRules(str).map(rule => {
        const parsed = parseConditionalRule(rule);
        if (!parsed) return 'Tempo massimo (cond): ' + translateOsmTime(rule);

        return `Tempo massimo: ${maxstayValueToItalian(parsed.value)} nei giorni/orari: ${parsed.condition}`;
      });
    }

    // Formatta fee:conditional / access:conditional in modo uniforme:
    // "<yesLabel> nei giorni/orari: ..." / "<noLabel> nei giorni/orari: ...".
    // Ritorna { text, danger } per ogni regola, pronto per essere renderizzato come badge.
    function formatYesNoConditional(str, yesLabel, noLabel) {
      return splitOsmRules(str).map(rule => {
        const parsed = parseConditionalRule(rule);
        if (!parsed) return { text: translateOsmTime(rule), danger: false };

        const value = parsed.value.toLowerCase();
        if (value === 'yes') return { text: `${yesLabel} nei giorni/orari: ${parsed.condition}`, danger: false };
        if (value === 'no') return { text: `${noLabel} nei giorni/orari: ${parsed.condition}`, danger: true };
        return { text: `${parsed.value} nei giorni/orari: ${parsed.condition}`, danger: false };
      });
    }

    // --- Inversione fasce orarie (per fee:conditional=no @ ...: mostra quando SI PAGA, non quando è gratis) ---

    function parseTimeRangesToMinutes(timeStr) {
      return timeStr.split(',').map(s => s.trim()).filter(Boolean).map(r => {
        const m = r.match(/^(\d{1,2}):(\d{2})-(\d{1,2}):(\d{2})$/);
        if (!m) return null;
        return { start: (+m[1]) * 60 + (+m[2]), end: (+m[3]) * 60 + (+m[4]) };
      }).filter(Boolean);
    }

    function mergeAndComplementRanges(ranges) {
      // Un intervallo che "avvolge" la mezzanotte (es. 20:00-08:00) diventa due intervalli separati
      const expanded = [];
      ranges.forEach(r => {
        if (r.end <= r.start) { expanded.push({ start: r.start, end: 1440 }); expanded.push({ start: 0, end: r.end }); }
        else expanded.push(r);
      });
      expanded.sort((a, b) => a.start - b.start);

      const merged = [];
      expanded.forEach(r => {
        const last = merged[merged.length - 1];
        if (last && r.start <= last.end) last.end = Math.max(last.end, r.end);
        else merged.push({ start: r.start, end: r.end });
      });

      const complement = [];
      let cursor = 0;
      merged.forEach(r => {
        if (r.start > cursor) complement.push({ start: cursor, end: r.start });
        cursor = Math.max(cursor, r.end);
      });
      if (cursor < 1440) complement.push({ start: cursor, end: 1440 });
      return complement;
    }

    function minutesToHHMM(m) {
      const h = Math.floor(m / 60), mm = m % 60;
      return String(h).padStart(2, '0') + ':' + String(mm).padStart(2, '0');
    }

    function rangesToTimeString(ranges) {
      return ranges.map(r => minutesToHHMM(r.start) + '-' + (r.end === 1440 ? '24:00' : minutesToHHMM(r.end))).join(',');
    }

    // Da una condizione tipo "Mo-Sa 13:00-15:00,20:00-08:00; Su" calcola l'orario complementare
    // (quando NON vale la condizione, cioè quando si paga se la condizione descrive la gratuità).
    // I gruppi giorno senza fascia oraria (es. "Su" da solo) valgono tutto il giorno: nessun
    // complemento, quindi quel giorno non compare mai tra gli orari a pagamento.
    function invertConditionToPaidSchedule(rawCondition) {
      const groups = rawCondition.split(';').map(s => s.trim()).filter(Boolean);
      const entries = [];

      groups.forEach(group => {
        const m = group.match(/^([A-Za-z]{2}(?:-[A-Za-z]{2})?(?:,\s*[A-Za-z]{2}(?:-[A-Za-z]{2})?)*)\s*(.*)$/);
        if (!m) return;
        const days = m[1];
        const timePart = m[2].trim();
        if (!timePart) return; // tutto il giorno gratis: nessun orario a pagamento quel giorno

        const ranges = parseTimeRangesToMinutes(timePart);
        if (!ranges.length) return;

        const paidRanges = mergeAndComplementRanges(ranges);
        if (!paidRanges.length) return;

        entries.push(`${translateOsmTime(days)} ${rangesToTimeString(paidRanges)}`);
      });

      return entries.join('; ');
    }

    // fee:conditional=no @ (...) va mostrato come "A pagamento nei giorni/orari: <orario invertito>",
    // non come "Gratuito nei giorni/orari: <orario dichiarato>": all'utente interessa sapere quando paga.
    function formatFeeConditional(str) {
      return splitOsmRules(str).map(rule => {
        const m = rule.match(/^(.+?)\s*@\s*\((.+)\)\s*$/) || rule.match(/^(.+?)\s*@\s*(.+?)\s*$/);
        if (!m) return { text: translateOsmTime(rule), danger: false };

        const value = m[1].trim().toLowerCase();
        const rawCondition = m[2].trim();

        if (value === 'yes') {
          return { text: `A pagamento nei giorni/orari: ${translateOsmTime(rawCondition)}`, danger: false };
        }
        if (value === 'no') {
          const paidSchedule = invertConditionToPaidSchedule(rawCondition);
          return paidSchedule
            ? { text: `A pagamento nei giorni/orari: ${paidSchedule}`, danger: false }
            : { text: `Gratuito nei giorni/orari: ${translateOsmTime(rawCondition)}`, danger: false };
        }
        return { text: `${value} nei giorni/orari: ${translateOsmTime(rawCondition)}`, danger: false };
      });
    }

    // Nome italiano dello stallo speciale, usato come titolo del popup e nel campo "Tipo"
    function getSpecialStallName(ps) {
      const names = {
        disabled: 'Disabili',
        charging: 'Ricarica EV',
        loading: 'Carico/Scarico',
        delivery: 'Carico/Scarico',
        hgv: 'Mezzi pesanti',
        parent: 'Famiglie',
        women: 'Donne',
        emergency: 'Emergenza',
        police: 'Polizia',
        motorcycle: 'Moto',
        bus: 'Bus'
      };
      return names[ps] || '';
    }

    // Stessi colori usati per disegnare i marker sulla mappa, riusati nell'header del popup
    function getPopupTheme(tags) {
      var ps = tags.parking_space || '';

      if (tags.amenity === 'parking_space' && ps !== 'normal') {
        if (ps === 'disabled') return { c1: '#fde047', c2: '#eab308', icon: 'accessibility' };
        if (ps === 'charging') return { c1: '#7dd3fc', c2: '#0284c7', icon: 'zap' };
        if (['emergency', 'police'].includes(ps)) return { c1: '#60a5fa', c2: '#1e40af', icon: 'shield' };
        if (ps === 'motorcycle') return { c1: '#fca5a5', c2: '#dc2626', icon: 'bike' };
        if (['delivery', 'loading', 'hgv'].includes(ps)) return { c1: '#fed7aa', c2: '#d97706', icon: 'truck' };
        if (['parent', 'women'].includes(ps)) return { c1: '#fbcfe8', c2: '#db2777', icon: 'baby' };
        if (ps === 'bus') return { c1: '#67e8f9', c2: '#0e7490', icon: 'bus' };
        return { c1: '#9ca3af', c2: '#374151', icon: 'square-parking' };
      }

      var fee = tags.fee || '', cond = tags['parking:condition'] || '';
      var accessVal = tags.access || '';
      var vehicleVal = tags.vehicle || '';
      var maxstay = (tags.maxstay || '').toString().trim().toLowerCase();
      var hasMaxstay = !!maxstay && !['no', 'none', 'unlimited', '0'].includes(maxstay);
      var hasDisc = ((cond || '').toLowerCase().includes('disc')) || hasMaxstay || !!tags['maxstay:conditional'];

      if (['private', 'customers', 'destination', 'permit'].includes(accessVal) || vehicleVal === 'permit') {
        return { c1: '#fb923c', c2: '#ea580c', icon: 'square-parking' };
      }
      if (fee === 'yes' || fee === 'conditional' || tags['fee:conditional']) {
        return { c1: '#60a5fa', c2: '#1d4ed8', icon: 'square-parking' };
      }
      if (hasDisc) {
        return { c1: '#a78bfa', c2: '#7c3aed', icon: 'square-parking' };
      }
      if (fee === 'no') {
        return { c1: '#4ade80', c2: '#15803d', icon: 'square-parking' };
      }
      return { c1: '#94a3b8', c2: '#64748b', icon: 'square-parking' };
    }

    function buildPopupContent(tags, lat, lon, osmMeta) {
      var name = tags.name || tags.ref ||
        (tags.amenity === 'parking_space' ? (getSpecialStallName(tags.parking_space) || 'Stallo speciale') : 'Area di Sosta');
      var operator = tags.operator || '';

      var accessRaw = tags.access || '';
      var accessConditional = tags['access:conditional'] || '';
      var vehicleAccess = tags.vehicle || '';
      var access = 'Pubblico';
      if (accessRaw === 'private') access = 'Privato';
      else if (accessRaw === 'customers') access = 'Solo clienti';
      else if (accessRaw === 'permissive') access = 'Autorizzato';
      else if (accessRaw === 'destination') access = 'Solo residenti';
      else if (accessRaw === 'permit' || vehicleAccess === 'permit') access = 'Solo con permesso';
      else if (accessRaw === 'no') access = 'Vietato';

      var accessNoteHtml = '';
      if (accessConditional) {
        accessNoteHtml = formatYesNoConditional(accessConditional, 'Aperto', 'Vietato')
          .map(r => `<div class="badge-note ${r.danger ? 'danger' : ''}">${escapeHtml(r.text)}</div>`)
          .join('');
      }

      var feeRaw = tags.fee || '';
      var feeConditional = tags['fee:conditional'] || '';
      var fee = 'Non specificato';
      var feeNoteHtml = '';

      if (feeRaw === 'no') fee = 'Gratuito';
      else if (feeRaw === 'yes') fee = 'A pagamento';
      else if (feeRaw === 'conditional') fee = 'Condizionato:';

      if (feeConditional) {
        fee = (fee === 'Non specificato') ? 'Condizionato:' : (fee);

        feeNoteHtml = formatFeeConditional(feeConditional)
          .map(r => `<div class="badge-note ${r.danger ? 'danger' : ''}">${escapeHtml(r.text)}</div>`)
          .join('');
      }

      // ===== Limitazioni (badge viola per "a tempo") =====
      var notes = [];        // testo normale (con <br>)
      var notesBadges = [];  // HTML badge

      var cond = tags['parking:condition'] || '';
      var interval = tags['parking:condition:time_interval'] || '';
      var maxstay = tags.maxstay || '';
      var maxstayConditional = tags['maxstay:conditional'] || '';

      if ((cond || '').toLowerCase().includes('disc')) {
        notesBadges.push(`<div class="badge-note time">Disco orario</div>`);
      }

      if (interval) {
        notesBadges.push(
          `<div class="badge-note time">${escapeHtml('Validità: ' + translateOsmTime(interval))}</div>`
        );
      }

      if (maxstay) {
        const ms = String(maxstay).toLowerCase().trim();
        if (!['no','none','unlimited','0'].includes(ms)) {
          const vIt = maxstayValueToItalian(maxstay);
          notesBadges.push(`<div class="badge-note time">${escapeHtml('Tempo massimo: ' + vIt)}</div>`);
        }
      }

      if (maxstayConditional) {
        formatMaxstayConditionalItalian(maxstayConditional).forEach(line => {
          notesBadges.push(`<div class="badge-note time">${escapeHtml(line)}</div>`);
        });
      }

      if ((cond || '').toLowerCase().includes('ticket')) notes.push('Sosta a ticket');
      if ((cond || '').toLowerCase().includes('resident')) notes.push('Riservato residenti');

      var notesParts = [];
      if (notesBadges.length) notesParts.push(notesBadges.join(''));
      if (notes.length) notesParts.push(notes.map(x => escapeHtml(x)).join('<br>'));
      var notesHtml = notesParts.join('<br>');

      var ps = tags.parking_space || '';
      var typeLabel = getSpecialStallName(ps) || ps || '';

      /* charge=* e payment:* */
      var chargeRaw = tags.charge || '';
      var chargeConditional = tags['charge:conditional'] || '';
      var chargeHtml = '';

      if (chargeRaw) {
        chargeHtml += `<div class="badge-note">${escapeHtml(chargeRaw)}</div>`;
      }
      if (chargeConditional) {
        chargeHtml += splitOsmRules(chargeConditional).map(p => {
          p = p.trim();
          return `<div class="badge-note">${escapeHtml(translateOsmTime(p))}</div>`;
        }).join('');
      }

      function paymentLabel(method) {
        const m = (method || '').toLowerCase();
        if (m === 'cash') return 'Contanti';
        if (m === 'coins') return 'Monete';
        if (m === 'notes') return 'Banconote';
        if (m === 'credit_cards') return 'Carte di credito';
        if (m === 'debit_cards') return 'Bancomat / carte di debito';
        if (m === 'cards') return 'Carte';
        if (m === 'contactless') return 'Contactless';
        if (m === 'visa') return 'Visa';
        if (m === 'mastercard') return 'Mastercard';
        if (m === 'maestro') return 'Maestro';
        if (m === 'apple_pay') return 'Apple Pay';
        if (m === 'google_pay') return 'Google Pay';
        if (m === 'sms') return 'SMS';
        if (m === 'phone') return 'Telefono';
        return (method || '').replace(/_/g, ' ');
      }

      var paymentMethods = Object.keys(tags)
        .filter(k => k.startsWith('payment:'))
        .map(k => ({ method: k.slice('payment:'.length), val: String(tags[k] || '').toLowerCase() }))
        .filter(x => x.val === 'yes' || x.val === 'only')
        .map(x => paymentLabel(x.method) + (x.val === 'only' ? ' (solo)' : ''));

      var paymentHtml = paymentMethods.length
        ? `<div class="badge-note">${escapeHtml(paymentMethods.join(', '))}</div>`
        : '';

      var theme = getPopupTheme(tags);

      var html = `
        <div class="popup-header-container" style="background:linear-gradient(135deg, ${theme.c1}, ${theme.c2})">
          <div class="popup-icon-box"><i data-lucide="${theme.icon}"></i></div>
          <div class="popup-title">${escapeHtml(name)}</div>
        </div>

        ${operator ? `
        <div class="popup-section">
          <span class="label">Gestore</span>
          <span class="val">${escapeHtml(operator)}</span>
        </div>` : ''}

        <div class="popup-section">
          <span class="label">Accesso</span>
          <span class="val">${escapeHtml(access)} ${accessNoteHtml}</span>
        </div>

        <div class="popup-section">
          <span class="label">Costo</span>
          <span class="val">${escapeHtml(fee)} ${feeNoteHtml}</span>
        </div>

        ${(chargeHtml) ? `
        <div class="popup-section">
          <span class="label">Tariffa</span>
          <span class="val">${chargeHtml}</span>
        </div>` : ''}

        ${(paymentHtml) ? `
        <div class="popup-section">
          <span class="label">Metodi di pagamento</span>
          <span class="val">${paymentHtml}</span>
        </div>` : ''}

        ${notesHtml ? `
        <div class="popup-section">
          <span class="label">Limitazioni</span>
          <span class="val">${notesHtml}</span>
        </div>` : ''}

        ${tags.capacity || typeLabel ? `
        <div class="popup-section" style="flex-direction: row; gap: 20px;">
          ${tags.capacity ? `<div><span class="label">Posti </span><span class="val">${escapeHtml(tags.capacity)}</span></div>` : ''}
          ${typeLabel ? `<div><span class="label">Tipo </span><span class="val">${escapeHtml(typeLabel)}</span></div>` : ''}
        </div>` : ''}

        ${tags.note ? `
        <div class="popup-section">
          <span class="label">Note</span>
          <span class="val">${escapeHtml(tags.note)}</span>
        </div>` : ''}

        <div class="popup-links">
          <a href="${buildGMapsUrl(lat, lon)}" target="_blank">Vai a</a>
          <a href="${buildIdUrl(osmMeta.type, osmMeta.id, lat, lon)}" target="_blank">Modifica</a>
        </div>
      `;

      return html;
    }

    function buildParkingMeterPopup(tags, lat, lon, osmMeta){
      const name = tags.name || tags.ref || 'Parcometro';
      const operator = tags.operator || '';
      const paymentMethods = Object.keys(tags)
        .filter(k => k.startsWith('payment:'))
        .map(k => ({ method: k.slice('payment:'.length), val: String(tags[k] || '').toLowerCase() }))
        .filter(x => x.val === 'yes' || x.val === 'only')
        .map(x => x.method.replace(/_/g,' ') + (x.val === 'only' ? ' (solo)' : ''));

      return `
        <div class="popup-header-container" style="background:linear-gradient(135deg, #fdba74, var(--meter-fill))">
          <div class="popup-icon-box"><i data-lucide="ticket"></i></div>
          <div class="popup-title">${escapeHtml(name)}</div>
        </div>

        ${operator ? `
        <div class="popup-section">
          <span class="label">Gestore</span>
          <span class="val">${escapeHtml(operator)}</span>
        </div>` : ''}

        ${paymentMethods.length ? `
        <div class="popup-section">
          <span class="label">Metodi di pagamento (raw)</span>
          <span class="val">${escapeHtml(paymentMethods.join(', '))}</span>
        </div>` : ''}

        ${tags.note ? `
        <div class="popup-section">
          <span class="label">Note</span>
          <span class="val">${escapeHtml(tags.note)}</span>
        </div>` : ''}

        <div class="popup-links">
          <a href="${buildGMapsUrl(lat, lon)}" target="_blank">Vai a</a>
          <a href="${buildIdUrl(osmMeta.type, osmMeta.id, lat, lon)}" target="_blank">Modifica</a>
        </div>
      `;
    }

    const overpassCache = new Map();
    const overpassEndpoints = [
      'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
      'https://overpass-api.de/api/interpreter',
      'https://overpass.openstreetmap.ru/cgi/interpreter'
    ];
    let activeOverpassController = null;

    function sleep(ms) {
      return new Promise(resolve => setTimeout(resolve, ms));
    }

    function getCacheKey(center, zoom) {
      const precision = zoom >= 16 ? 4 : 3;
      return `${center.lat.toFixed(precision)},${center.lng.toFixed(precision)},z${Math.round(zoom)}`;
    }

    async function fetchOverpassWithFallback(query, signal) {
      const requestBody = 'data=' + encodeURIComponent(query);
      const errors = [];

      for (const endpoint of overpassEndpoints) {
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: requestBody,
            signal
          });

          if (!response.ok) {
            errors.push(`${endpoint} -> HTTP ${response.status}`);
            continue;
          }

          return await response.json();
        } catch (error) {
          if (error.name === 'AbortError') throw error;
          errors.push(`${endpoint} -> ${error.message}`);
        }
      }

      throw new Error('Overpass fallback failed: ' + errors.join(' | '));
    }

    async function fetchParking(forceRefresh = false) {
      if (activeOverpassController) {
        activeOverpassController.abort();
      }

      const center = map.getCenter();
      const zoom = map.getZoom() || 15;
      const radius = zoom >= 17 ? 700 : (zoom >= 15 ? 1000 : 1400);
      const cacheKey = getCacheKey(center, zoom);

      if (forceRefresh) {
        overpassCache.clear();
      }

      if (!forceRefresh && overpassCache.has(cacheKey)) {
        renderParking(overpassCache.get(cacheKey));
        pruneFarElements(center, radius * 3);
        setStatus('Dati da cache');
        setTimeout(() => setStatus(''), 900);
        return;
      }

      setStatus('Aggiornamento dati...');

      const query = `[out:json][timeout:25];(
        way["amenity"="parking"](around:${radius},${center.lat},${center.lng});
        relation["amenity"="parking"](around:${radius},${center.lat},${center.lng});
        node["amenity"="parking"](around:${radius},${center.lat},${center.lng});

        node["amenity"="parking_space"]["parking_space"]["parking_space"!="normal"](around:${radius},${center.lat},${center.lng});
        way["amenity"="parking_space"]["parking_space"]["parking_space"!="normal"](around:${radius},${center.lat},${center.lng});

        /* ✅ PARCOMETRI */
        node["amenity"="vending_machine"]["vending"="parking_tickets"](around:${radius},${center.lat},${center.lng});
        way["amenity"="vending_machine"]["vending"="parking_tickets"](around:${radius},${center.lat},${center.lng});
        relation["amenity"="vending_machine"]["vending"="parking_tickets"](around:${radius},${center.lat},${center.lng});
      );out body geom qt;`;

      activeOverpassController = new AbortController();
      const maxRetries = 3;

      try {
        let data = null;

        for (let attempt = 1; attempt <= maxRetries; attempt++) {
          try {
            if (attempt > 1) {
              setStatus(`Errore API, riprovo (${attempt}/${maxRetries})...`);
            }
            data = await fetchOverpassWithFallback(query, activeOverpassController.signal);
            break;
          } catch (error) {
            if (error.name === 'AbortError') return;
            if (attempt === maxRetries) throw error;
            await sleep(600 * attempt);
          }
        }

        if (!data) return;
        if (overpassCache.size >= 30) {
          overpassCache.delete(overpassCache.keys().next().value); // scarta la voce più vecchia
        }
        overpassCache.set(cacheKey, data);
        renderParking(data);
        pruneFarElements(center, radius * 3);
        setStatus('Dati caricati');
        setTimeout(() => setStatus(''), 1500);
      } catch (err) {
        console.warn('Errore fetch:', err);
        setStatus('Errore connessione. Riprova più tardi.');
      }
    }




        function renderParking(data) {
      // NOTA: Ho rimosso i clearLayers() da qui. 
      // I dati vecchi rimangono sulla mappa.
      
      if (!data || !data.elements) return;

      data.elements.forEach(el => {
        // Creiamo un ID univoco per OSM (tipo + id)
        var uniqueId = el.type + ':' + el.id;

        // Se lo abbiamo già disegnato, saltiamo (per evitare duplicati/sovrapposizioni)
        if (loadedIds.has(uniqueId)) return;

        // Aggiungiamo l'ID al registro
        loadedIds.add(uniqueId);

        var tags = el.tags || {};
        var osmMeta = { type: el.type, id: el.id };

        /* ===== Aree di sosta ===== */
        if (tags.amenity === 'parking') {
          var color, fillColor;
          var fee = tags.fee || '', cond = tags['parking:condition'] || '';
          var accessVal = tags.access || '';
          var vehicleVal = tags.vehicle || '';

          var maxstay = (tags.maxstay || '').toString().trim();
          var maxstayLc = maxstay.toLowerCase();
          var hasMaxstay = !!maxstay && !['no','none','unlimited','0'].includes(maxstayLc);
          var hasMaxstayConditional = !!tags['maxstay:conditional'];
          var hasDisc = ((cond || '').toLowerCase().includes('disc')) || hasMaxstay || hasMaxstayConditional;

          if (['private','customers','destination','permit'].includes(accessVal) || vehicleVal === 'permit') {
            color = '#ea580c'; fillColor = '#fb923c';
          } else if (fee === 'yes' || fee === 'conditional' || tags['fee:conditional']) {
            color = '#1d4ed8'; fillColor = '#60a5fa';
          } else if (hasDisc) {
            color = '#7c3aed'; fillColor = '#a78bfa';
          } else if (fee === 'no') {
            color = '#15803d'; fillColor = '#4ade80';
          } else {
            color = '#64748b'; fillColor = '#94a3b8';
          }

          if (el.geometry) {
            var pts = el.geometry.map(g => [g.lat, g.lon]);
            var layer = (pts[0][0] === pts[pts.length-1][0] && pts.length > 2) ?
              L.polygon(pts, { color, weight: 2, fillColor, fillOpacity: 0.4, pane: 'parkingAreasPane' }) :
              L.polyline(pts, { color, weight: 3, pane: 'parkingAreasPane' });

            layer.bindPopup(buildPopupContent(tags, pts[0][0], pts[0][1], osmMeta)).addTo(parkingAreasLayer);
            idToLayer.set(uniqueId, { layer, group: parkingAreasLayer, lat: pts[0][0], lon: pts[0][1] });
          } else if (el.lat) {
            var layer = L.circleMarker([el.lat, el.lon], { radius: 7, color, fillColor, fillOpacity: 0.7, pane: 'parkingAreasPane' })
              .bindPopup(buildPopupContent(tags, el.lat, el.lon, osmMeta)).addTo(parkingAreasLayer);
            idToLayer.set(uniqueId, { layer, group: parkingAreasLayer, lat: el.lat, lon: el.lon });
          }
        }

        /* ===== Stalli speciali ===== */
        if (tags.amenity === 'parking_space' && tags.parking_space !== 'normal') {
          var cPs, fPs, ps = tags.parking_space;
          if (ps === 'disabled') { cPs = '#eab308'; fPs = '#fde047'; }
          else if (ps === 'charging') { cPs = '#0284c7'; fPs = '#f0f9ff'; }
          else if (['emergency','police'].includes(ps)) { cPs = '#1e40af'; fPs = '#60a5fa'; }
          else if (ps === 'motorcycle') { cPs = '#dc2626'; fPs = '#fca5a5'; }
          else if (['delivery','loading','hgv'].includes(ps)) { cPs = '#d97706'; fPs = '#fed7aa'; }
          else if (['parent','women'].includes(ps)) { cPs = '#db2777'; fPs = '#fbcfe8'; }
          else if (ps === 'bus') { cPs = '#0e7490'; fPs = '#67e8f9'; }
          else { cPs = '#374151'; fPs = '#6b7280'; }

          if (el.geometry) {
            var pts2 = el.geometry.map(g => [g.lat, g.lon]);
            var layer2 = L.polygon(pts2, { color: cPs, weight: 2, fillColor: fPs, fillOpacity: 0.8, pane: 'parkingSpacesPane' })
              .bindPopup(buildPopupContent(tags, pts2[0][0], pts2[0][1], osmMeta)).addTo(parkingSpacesLayer);
            idToLayer.set(uniqueId, { layer: layer2, group: parkingSpacesLayer, lat: pts2[0][0], lon: pts2[0][1] });
          } else if (el.lat) {
            var layer2 = L.circleMarker([el.lat, el.lon], { radius: 8, color: cPs, fillColor: fPs, fillOpacity: 0.9, pane: 'parkingSpacesPane' })
              .bindPopup(buildPopupContent(tags, el.lat, el.lon, osmMeta)).addTo(parkingSpacesLayer);
            idToLayer.set(uniqueId, { layer: layer2, group: parkingSpacesLayer, lat: el.lat, lon: el.lon });
          }
        }

        /* ===== Parcometri ===== */
        if (tags.amenity === 'vending_machine' && tags.vending === 'parking_tickets') {
          let lat = el.lat;
          let lon = el.lon;

          if ((lat == null || lon == null) && el.geometry && el.geometry.length) {
            lat = el.geometry[0].lat;
            lon = el.geometry[0].lon;
          }
          if (lat != null && lon != null) {
            var meterLayer = L.circleMarker([lat, lon], {
              radius: 5,
              color: getComputedStyle(document.documentElement).getPropertyValue('--meter-stroke').trim() || '#111827',
              weight: 2,
              fillColor: getComputedStyle(document.documentElement).getPropertyValue('--meter-fill').trim() || '#f97316',
              fillOpacity: 0.95,
              pane: 'parkometersPane'
            }).bindPopup(buildParkingMeterPopup(tags, lat, lon, osmMeta))
              .addTo(parkometersLayer);
            idToLayer.set(uniqueId, { layer: meterLayer, group: parkometersLayer, lat, lon });
          }
        }
      });
    }


    // Rimuove i marker/poligoni troppo lontani dal centro corrente, per evitare
    // che la mappa accumuli all'infinito elementi mai ripuliti durante il pan.
    function pruneFarElements(center, maxDistanceMeters) {
      idToLayer.forEach((entry, uniqueId) => {
        var d = map.distance(center, L.latLng(entry.lat, entry.lon));
        if (d > maxDistanceMeters) {
          entry.group.removeLayer(entry.layer);
          idToLayer.delete(uniqueId);
          loadedIds.delete(uniqueId);
        }
      });
    }

    var fetchTimeout = null;
    map.on('moveend', () => {
      if (fetchTimeout) clearTimeout(fetchTimeout);
      fetchTimeout = setTimeout(() => fetchParking(false), 350);
    });

    fetchParking(false);

    function showSearchResults(items) {
      const box = document.getElementById('searchResults');
      if (!items.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.innerHTML = items.map((r, i) => {
        return `<div class="search-result-item" data-lat="${r.lat}" data-lon="${r.lon}">
                  ${i+1}) ${escapeHtml(r.display_name)}
                </div>`;
      }).join('');
      box.style.display = 'block';

      box.querySelectorAll('.search-result-item').forEach(el => {
        el.onclick = () => {
          map.setView([parseFloat(el.dataset.lat), parseFloat(el.dataset.lon)], 17);
          showSearchResults([]);
          setStatus('Posizione aggiornata');
        };
      });
    }

    // Un CAP italiano (5 cifre) viene cercato tra i nodi OSM reali (postal_code/addr:postcode),
    // non tramite Nominatim: quello restituirebbe il centroide calcolato sull'area del CAP,
    // non un punto effettivamente presente sulla mappa.
    // Bounding box dell'Italia: evita di far calcolare a Overpass l'area del confine
    // amministrativo (lento e spesso in timeout sui mirror pubblici gratuiti).
    const ITALY_BBOX = '35.2,6.6,47.3,18.6';

    // fetchOverpassWithFallback si ferma alla prima risposta HTTP 200, anche se ha 0 risultati:
    // per le ricerche puntuali (CAP/città) alcuni mirror hanno dati incompleti e rispondono vuoti
    // pur avendo l'endpoint online, quindi qui proviamo tutti i mirror finché uno non trova qualcosa.
    async function fetchOverpassPreferNonEmpty(query) {
      let firstOk = null;
      for (const endpoint of overpassEndpoints) {
        try {
          const response = await fetch(endpoint, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(query)
          });
          if (!response.ok) continue;

          const data = await response.json();
          if (data && data.elements && data.elements.length) return data;
          if (!firstOk) firstOk = data;
        } catch (err) {
          console.warn('Overpass mirror fallito:', endpoint, err.message);
        }
      }
      return firstOk || { elements: [] };
    }

    async function geocodeCapFromOsm(cap) {
      const query = `[out:json][timeout:25];
        (
          node["postal_code"="${cap}"](${ITALY_BBOX});
          node["addr:postcode"="${cap}"](${ITALY_BBOX});
        );
        out body 5;`;

      try {
        const data = await fetchOverpassPreferNonEmpty(query);
        const el = data && data.elements && data.elements[0];
        if (!el || el.lat == null) return false;

        map.setView([el.lat, el.lon], 15);
        setStatus('CAP trovato');
        setTimeout(() => setStatus(''), 1200);
        return true;
      } catch (err) {
        console.warn('Errore ricerca CAP:', err);
        return false;
      }
    }

    const placeTypeLabels = {
      city: 'Città', town: 'Comune', village: 'Paese', hamlet: 'Frazione',
      suburb: 'Quartiere', municipality: 'Comune', borough: 'Quartiere', locality: 'Località'
    };

    // Le preposizioni italiane restano minuscole nel "Title Case" (es. "Castiglione delle Stiviere")
    const ITALIAN_LOWER_WORDS = new Set(['di','del','della','dei','delle','dello','d','a','al','allo','alla','agli','alle','sul','sulla','sui','e','in','l']);
    function toItalianTitleCase(q) {
      return q.trim().split(/\s+/).map((w, i) => {
        if (i > 0 && ITALIAN_LOWER_WORDS.has(w.toLowerCase())) return w.toLowerCase();
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      }).join(' ');
    }

    // Cerca il nodo OSM reale place=* con corrispondenza esatta sul nome (es. https://www.openstreetmap.org/node/64778671).
    // Il confronto "=" usa l'indice dei valori di Overpass ed è quasi istantaneo; una ricerca con
    // regex "~" su tutta Italia, invece, deve scansionare ogni nodo con tag place e va in timeout
    // sui mirror pubblici (verificato: 26s di timeout anche per una singola città).
    async function geocodeExactPlaceNode(q) {
      const name = toItalianTitleCase(q).replace(/"/g, '\\"');
      const query = `[out:json][timeout:15];(node["place"]["name"="${name}"](${ITALY_BBOX}););out body 5;`;

      try {
        const data = await fetchOverpassPreferNonEmpty(query);
        return (data.elements || [])
          .filter(el => el.lat != null && el.tags)
          .map(el => ({
            lat: el.lat,
            lon: el.lon,
            name: el.tags.name,
            display_name: el.tags.name + (placeTypeLabels[el.tags.place] ? ` (${placeTypeLabels[el.tags.place]})` : '')
          }));
      } catch (err) {
        console.warn('Errore ricerca nodo esatto:', err);
        return [];
      }
    }

    // Fallback via Nominatim: per alcune città importanti (es. capoluoghi di provincia) il nodo
    // place=* viene "assorbito" da Nominatim nel confine amministrativo e non compare nei risultati,
    // quindi qui accettiamo anche relation/way di tipo boundary come ultima spiaggia.
    async function geocodePlaceFromOsm(q) {
      const exact = await geocodeExactPlaceNode(q);
      if (exact.length) return exact.slice(0, 6);

      const url =
        'https://nominatim.openstreetmap.org/search?format=json' +
        '&addressdetails=1' +
        '&countrycodes=it' +
        '&q=' + encodeURIComponent(q) +
        '&limit=25';

      try {
        const res = await fetch(url, { headers: { 'Accept-Language': 'it' } });
        const results = await res.json();
        if (!results || !results.length) return [];

        const qLower = q.trim().toLowerCase();

        return results
          .filter(r => (r.class === 'place' && placeTypeLabels[r.type]) ||
                       (r.class === 'boundary' && r.type === 'administrative'))
          .map(r => {
            const name = (r.display_name.split(',')[0] || '').trim();
            const label = placeTypeLabels[r.type] || (r.addresstype ? placeTypeLabels[r.addresstype] : null);
            return {
              lat: r.lat,
              lon: r.lon,
              name,
              display_name: label ? `${name} (${label})` : name
            };
          })
          // Il nome identico alla ricerca (es. "Treviso") prima delle frazioni/quartieri omonimi
          .sort((a, b) => (a.name.toLowerCase() === qLower ? -1 : 0) - (b.name.toLowerCase() === qLower ? -1 : 0))
          .slice(0, 6);
      } catch (err) {
        console.warn('Errore ricerca città:', err);
        return [];
      }
    }

    async function geocode(q) {
      if (!q) return;

      showSearchResults([]);
      setStatus('Cerco località...');

      const isCap = /^\d{5}$/.test(q);
      if (isCap) {
        const found = await geocodeCapFromOsm(q);
        if (found) return;
        setStatus('CAP non trovato su OSM');
        return;
      }

      const placeResults = await geocodePlaceFromOsm(q);
      if (!placeResults.length) { setStatus('Nessun risultato'); return; }

      showSearchResults(placeResults);
      setStatus('Seleziona un risultato');
    }

    document.getElementById('searchBtn').onclick = () => geocode(document.getElementById('searchInput').value.trim());
    document.getElementById('searchInput').onkeydown = (e) => {
      if (e.key === 'Enter') geocode(e.target.value.trim());
    };

    document.addEventListener('click', (e) => {
      const box = document.getElementById('searchResults');
      const sb = document.getElementById('searchBox');
      if (box.style.display === 'block' && !sb.contains(e.target)) showSearchResults([]);
    });

    // --- Nuova funzione per localizzare l'utente ---
    function locateUser() {
      if (!navigator.geolocation) {
        setStatus('GPS non disponibile');
        return;
      }
      setStatus('Cerco la tua posizione...');
      
      navigator.geolocation.getCurrentPosition(
        (p) => {
          map.setView([p.coords.latitude, p.coords.longitude], 17);
          setStatus('Posizione trovata');
        }, 
        () => setStatus('Errore o permesso negato'), 
        { enableHighAccuracy: true }
      );
    }

    // 1. Collega la funzione al click del pulsante (così puoi usarlo sempre)
    document.getElementById('gpsBtn').onclick = locateUser;

    // 2. Chiama la funzione SUBITO all'avvio (appena apri il sito)
    locateUser();


        document.getElementById('refreshBtn').onclick = () => {
      // Svuota tutto (cache e mappa)
      loadedIds.clear();
      idToLayer.clear();
      parkingAreasLayer.clearLayers();
      parkingSpacesLayer.clearLayers();
      parkometersLayer.clearLayers();
      
      setStatus('Reset dati e aggiornamento...');
      fetchParking(true);
    };


    /* ===== Schermo intero ===== */
    function updateFullscreenIcon() {
      const btn = document.getElementById('fullscreenBtn');
      const isFs = !!document.fullscreenElement;

      btn.innerHTML = isFs
        ? '<i data-lucide="minimize-2"></i>'
        : '<i data-lucide="maximize-2"></i>';

      lucide.createIcons({ root: btn });
    }

    function toggleFullscreen() {
      const root = document.documentElement;

      if (!document.fullscreenElement) {
        if (!root.requestFullscreen) {
          setStatus('Schermo intero non supportato');
          return;
        }
        root.requestFullscreen()
          .catch(() => setStatus('Impossibile attivare schermo intero'));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.getElementById('fullscreenBtn').onclick = toggleFullscreen;

    // Su iOS Safari la Fullscreen API non è supportata: nascondiamo il pulsante
    // invece di mostrarlo senza che faccia nulla.
    // Idem se l'app è già installata come PWA a schermo intero (manifest display:fullscreen):
    // il pulsante sarebbe ridondante e su alcuni browser innescherebbe comunque il banner nativo.
    var runningFullscreenPwa = window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
    if (!document.documentElement.requestFullscreen || runningFullscreenPwa) {
      document.getElementById('fullscreenBtn').style.display = 'none';
    }

    document.addEventListener('fullscreenchange', () => {
      updateFullscreenIcon();
      setTimeout(() => map.invalidateSize(), 200);
    });

    updateFullscreenIcon();
  </script>
</body>
