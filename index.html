      return html;
    }

    function buildParkingMeterPopup(tags, lat, lon, osmMeta){
      const name = tags.name || tags.ref || 'Parcometro';
      const operator = tags.operator || '';
      const paymentMethods = Object.keys(tags)
        .filter(k => k.startsWith('payment:'))
        .map(k => ({ method: k.slice('payment:'.length), val: String(tags[k] || '').toLowerCase() }))
        .filter(x => x.val === 'yes' || x.val === 'only')
        .map(x => x.method.replace(/_/g,' ') + (x.val === 'only' ? ' (solo)' : ''));

      return `
        <div class="popup-header-container" style="background:linear-gradient(135deg, #fdba74, var(--meter-fill))">
          <div class="popup-icon-box"><i data-lucide="ticket"></i></div>
          <div class="popup-title">${escapeHtml(name)}</div>
        </div>

        ${operator ? `
        <div class="popup-section">
          <span class="label">Gestore</span>
          <span class="val">${escapeHtml(operator)}</span>
        </div>` : ''}

        ${paymentMethods.length ? `
        <div class="popup-section">
          <span class="label">Metodi di pagamento (raw)</span>
          <span class="val">${escapeHtml(paymentMethods.join(', '))}</span>
        </div>` : ''}

        ${tags.note ? `
        <div class="popup-section">
          <span class="label">Note</span>
          <span class="val">${escapeHtml(tags.note)}</span>
        </div>` : ''}

        <div class="popup-links">
          <a href="${buildGMapsUrl(lat, lon)}" target="_blank">Vai a</a>
          <a href="${buildIdUrl(osmMeta.type, osmMeta.id, lat, lon)}" target="_blank">Modifica</a>
        </div>
      `;
    }

    // Mirror Overpass pubblici interrogati IN PARALLELO. Appena il primo
    // risponde i dati vanno subito sulla mappa; dopo una breve finestra
    // (OVERPASS_GRACE_MS) il caricamento si considera concluso, senza
    // aspettare il mirror più lento fino al timeout. Gli altri mirror però
    // continuano in background: uno può rispondere in fretta ma con dati
    // incompleti (replica indietro, query tagliata per carico...), quindi se
    // ne arriva uno con più elementi onUpdate viene richiamato comunque.
    const OVERPASS_MIRRORS = [
      'https://maps.mail.ru/osm/tools/overpass/api/interpreter',
      'https://overpass.kumi.systems/api/interpreter',
      'https://overpass.monicz.dev/api/interpreter',
      'https://overpass-api.de/api/interpreter',
      'https://z.overpass-api.de/api/interpreter'
      // overpass.private.coffee e lz4.overpass-api.de esclusi: verificato che
      // al momento non rispondono (rispettivamente connessione che non
      // chiude mai e timeout di connessione), sprecherebbero solo l'intero
      // OVERPASS_TIMEOUT_MS ad ogni caricamento senza mai contribuire dati.
      // overpass.openstreetmap.fr escluso: risponde correttamente da
      // server-to-server (curl), ma la risposta reale al POST (non alla
      // preflight OPTIONS) non porta l'header CORS in un browser, quindi la
      // fetch fallisce sempre con "blocked by CORS policy" — verificato.
    ];
    const OVERPASS_TIMEOUT_MS = 20000;
    const OVERPASS_GRACE_MS = 1200;

    // Stato dell'ultimo tentativo per provider, usato dal pannello diagnostico
    // aperto con la pressione prolungata sul pulsante "Aggiorna".
    const overpassDiagState = {};      // label -> 'loading' | 'success' | 'failed'
    const overpassDiagReachable = {};  // label -> true | false | undefined

    function shortOverpassLabel(url) {
      try { return new URL(url).hostname.replace(/^overpass\./, ''); } catch { return url; }
    }

    // Combina un AbortSignal "esterno" con uno "interno" (timeout del singolo
    // mirror): basta che uno dei due scatti per abortire la fetch.
    // AbortSignal.any non è ancora universale sui browser mobili più vecchi,
    // quindi qui si combina manualmente.
    function combineSignals(a, b) {
      if (!a) return b;
      if (!b) return a;
      const controller = new AbortController();
      if (a.aborted || b.aborted) { controller.abort(); return controller.signal; }
      a.addEventListener('abort', () => controller.abort(), { once: true });
      b.addEventListener('abort', () => controller.abort(), { once: true });
      return controller.signal;
    }

    // onUpdate (facoltativo) viene richiamato ogni volta che c'è un dato
    // migliore di quello mostrato finora, anche dopo che la promessa si è
    // risolta (con il migliore ottenuto entro la finestra di grazia).
    function fetchOverpassRace(query, externalSignal, onUpdate) {
      return new Promise((resolve, reject) => {
        let best = null, pending = OVERPASS_MIRRORS.length, graceTimer = null, done = false;

        const finish = () => {
          if (done) return;
          done = true;
          clearTimeout(graceTimer);
          if (externalSignal && externalSignal.aborted) {
            const e = new Error('Aborted'); e.name = 'AbortError'; reject(e); return;
          }
          if (best) resolve(best);
          else reject(new Error('Tutti i mirror Overpass hanno fallito o sono scaduti'));
        };

        OVERPASS_MIRRORS.forEach(url => {
          const label = shortOverpassLabel(url);
          overpassDiagState[label] = 'loading';
          updateDiagCell(label);
          let gotResponse = false;
          const signal = combineSignals(externalSignal, AbortSignal.timeout(OVERPASS_TIMEOUT_MS));

          fetch(url, {
            method: 'POST',
            headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
            body: 'data=' + encodeURIComponent(query),
            signal
          })
            .then(res => {
              gotResponse = true;
              overpassDiagReachable[label] = true;
              updateDiagReach(label);
              if (!res.ok) throw new Error(`HTTP ${res.status}`);
              return res.json();
            })
            .then(data => {
              overpassDiagState[label] = 'success';
              updateDiagCell(label);
              if (externalSignal && externalSignal.aborted) return;
              if (!best || (data.elements?.length || 0) > (best.elements?.length || 0)) {
                best = data;
                if (onUpdate) onUpdate(data);
              }
              if (!graceTimer && !done) graceTimer = setTimeout(finish, OVERPASS_GRACE_MS);
            })
            .catch(() => {
              overpassDiagState[label] = 'failed';
              updateDiagCell(label);
              if (!gotResponse) { overpassDiagReachable[label] = false; updateDiagReach(label); }
            })
            .finally(() => { if (--pending === 0) finish(); });
        });
      });
    }

    // ─── Caricamento dati a tessere ───
    // L'area è divisa in una griglia fissa di tessere da 0.01° (~1.1 x 0.8 km).
    // Ogni tessera scaricata resta in memoria e in localStorage: spostando la
    // mappa si scaricano solo le tessere nuove, quelle già viste compaiono
    // all'istante (anche dopo aver chiuso l'app), e quelle salvate ma vecchie
    // vengono mostrate subito e aggiornate in background.
    // Fonte dei dati: in Italia i file statici precalcolati ogni notte e
    // pubblicati con il sito (vedi scripts/build_tiles.py), serviti da CDN in
    // pochi millisecondi; nel resto del mondo (o se i file non ci sono, es. in
    // locale) Postpass, con Overpass come riserva, a blocchi 3x3 partendo da
    // quello al centro.
    const TILE_DEG = 0.01;
    const TILE_FRESH_MS = 6 * 60 * 60 * 1000;   // entro 6 ore una tessera non si riscarica
    const TILE_PERSIST_PREFIX = 'parkTile_v1:';
    const TILE_INDEX_KEY = 'parkTileIndex_v1';
    const TILE_PERSIST_MAX = 400;
    const MAX_TILES_SPAN = 7;                   // al massimo 7x7 tessere attorno al centro
    const BLOCK_SIZE = 3;
    const MAX_PARALLEL_BLOCKS = 2;
    const MIN_DATA_ZOOM = 12;

    // Vecchia cache a chiavi "centro+zoom", sostituita dalle tessere: libera spazio
    try { localStorage.removeItem('parkOverpassCache_v1'); } catch (err) {}

    const tileStore = new Map();      // key -> { ts, elements }
    const inflightTiles = new Set();
    const inflightControllers = new Set();
    let blockQueue = [];
    let activeBlocks = 0;
    let loadGeneration = 0;           // incrementato da "Aggiorna": scarta le risposte vecchie
    const MAX_AUTO_RETRIES = 3;
    let consecutiveFailures = 0, retryTimer = null;

    // ─── Dati statici precalcolati ───
    // index.json elenca le celle (5x5 tessere, ~5 x 4 km) coperte dall'estratto
    // OSM e quelle che hanno dati: una cella coperta senza file è vuota, senza
    // bisogno di chiederla. Formato delle celle: vedi scripts/build_tiles.py.
    // Nell'app Android (Capacitor) la pagina è servita dall'APK stesso: i dati
    // vanno presi dal sito pubblico, che li rigenera ogni notte.
    const STATIC_BASE = IS_NATIVE_APP ? PUBLIC_SITE_URL + 'data/' : 'data/';
    const TILES_PER_CELL = 5;
    let staticIndex = null;           // { covered: Set, data: Set, osmTimestamp }
    let staticIndexSettled = false;
    let staticFetchCache = 'default'; // 'no-cache' dopo "Aggiorna": riconvalida col server
    let activeStaticCells = 0;

    function cellKeyOfTile(i, j) {
      return Math.floor(i / TILES_PER_CELL) + '_' + Math.floor(j / TILES_PER_CELL);
    }

    function expandRuns(runs) {
      const set = new Set();
      runs.forEach(([i, j0, j1]) => { for (let j = j0; j <= j1; j++) set.add(i + '_' + j); });
      return set;
    }

    const staticIndexReady = fetch(STATIC_BASE + 'index.json', { cache: 'no-cache' })
      .then(res => res.ok ? res.json() : null)
      .then(idx => {
        if (!idx || idx.v !== 1 || idx.tilesPerCell !== TILES_PER_CELL) return;
        staticIndex = {
          covered: expandRuns(idx.covered),
          data: expandRuns(idx.data),
          osmTimestamp: idx.osmTimestamp || idx.generated
        };
      })
      .catch(() => { /* niente dati statici: si usa solo Overpass */ })
      .finally(() => {
        staticIndexSettled = true;
        if (initialLoadDone) loadVisibleTiles();
      });

    // [tipo, id, tag, lat, lon] per i nodi, [tipo, id, tag, [lat, lon, lat, lon...]]
    // per le way: stesso formato degli elementi Overpass usato dal render.
    function expandStaticElements(records) {
      return records.map(r => {
        if (r[0] === 'n') return { type: 'node', id: r[1], tags: r[2], lat: r[3], lon: r[4] };
        const flat = r[3], geometry = [];
        for (let k = 0; k < flat.length; k += 2) geometry.push({ lat: flat[k], lon: flat[k + 1] });
        return { type: 'way', id: r[1], tags: r[2], geometry };
      });
    }

    async function fetchStaticCell(cellKey) {
      const gen = loadGeneration;
      const [ci, cj] = cellKey.split('_').map(Number);
      const rect = {
        i0: ci * TILES_PER_CELL, i1: ci * TILES_PER_CELL + TILES_PER_CELL - 1,
        j0: cj * TILES_PER_CELL, j1: cj * TILES_PER_CELL + TILES_PER_CELL - 1
      };
      const rectKeys = [];
      for (let i = rect.i0; i <= rect.i1; i++) for (let j = rect.j0; j <= rect.j1; j++) rectKeys.push(tileKey(i, j));
      rectKeys.forEach(k => inflightTiles.add(k));
      activeStaticCells++;
      updateLoadingUi();

      try {
        let elements = [];
        if (staticIndex.data.has(cellKey)) {
          const res = await fetch(STATIC_BASE + 'cells/' + cellKey + '.json', { cache: staticFetchCache });
          if (!res.ok) throw new Error(`HTTP ${res.status}`);
          elements = expandStaticElements((await res.json()).e);
        }
        if (gen === loadGeneration) applyBlockData({ elements }, rect, true);
      } catch (err) {
        if (gen === loadGeneration) {
          console.warn('Errore cella statica:', cellKey, err);
          reportLoadError();
        }
      } finally {
        rectKeys.forEach(k => inflightTiles.delete(k));
        activeStaticCells--;
        updateLoadingUi();
      }
    }

    function tileKey(i, j) { return i + ',' + j; }
    function latToTile(lat) { return Math.floor(lat / TILE_DEG); }
    function lonToTile(lon) { return Math.floor(lon / TILE_DEG); }
    function isTileFresh(t) { return !!t && (Date.now() - t.ts) < TILE_FRESH_MS; }

    function readTileIndex() {
      try { return JSON.parse(localStorage.getItem(TILE_INDEX_KEY)) || {}; } catch (err) { return {}; }
    }

    function getTile(key) {
      if (tileStore.has(key)) return tileStore.get(key);
      try {
        const raw = localStorage.getItem(TILE_PERSIST_PREFIX + key);
        if (raw) {
          const t = JSON.parse(raw);
          tileStore.set(key, t);
          return t;
        }
      } catch (err) { /* storage non disponibile o dato corrotto */ }
      return null;
    }

    function evictPersistedTiles(index, keep) {
      const keys = Object.keys(index).sort((a, b) => index[a] - index[b]);
      keys.slice(0, Math.max(0, keys.length - keep)).forEach(k => {
        localStorage.removeItem(TILE_PERSIST_PREFIX + k);
        delete index[k];
      });
    }

    // JSON.stringify + localStorage sono sincroni: si scrive quando il browser
    // è libero, per non bloccare la mappa mentre la si sta trascinando.
    const whenIdle = window.requestIdleCallback
      ? (fn) => requestIdleCallback(fn, { timeout: 2000 })
      : (fn) => setTimeout(fn, 300);

    function persistTiles(entries) {
      whenIdle(() => writeTiles(entries));
    }

    function writeTiles(entries) {
      try {
        const index = readTileIndex();
        entries.forEach(([key, t]) => {
          const payload = JSON.stringify(t);
          try {
            localStorage.setItem(TILE_PERSIST_PREFIX + key, payload);
          } catch (err) {
            // Quota piena: libera metà delle tessere più vecchie e riprova una volta
            evictPersistedTiles(index, Math.floor(Object.keys(index).length / 2));
            localStorage.setItem(TILE_PERSIST_PREFIX + key, payload);
          }
          index[key] = t.ts;
        });
        evictPersistedTiles(index, TILE_PERSIST_MAX);
        localStorage.setItem(TILE_INDEX_KEY, JSON.stringify(index));
      } catch (err) { /* storage non disponibile, non bloccante */ }
    }

    // Tessere che coprono la vista attuale con un margine ampio (prefetch: le
    // zone attorno sono già pronte quando si scorre), ordinate dal centro
    function tilesForView() {
      const b = map.getBounds().pad(0.75);
      const c = map.getCenter();
      const ci = latToTile(c.lat), cj = lonToTile(c.lng);
      const half = Math.floor(MAX_TILES_SPAN / 2);
      const i0 = Math.max(latToTile(b.getSouth()), ci - half), i1 = Math.min(latToTile(b.getNorth()), ci + half);
      const j0 = Math.max(lonToTile(b.getWest()), cj - half), j1 = Math.min(lonToTile(b.getEast()), cj + half);
      const out = [];
      for (let i = i0; i <= i1; i++) {
        for (let j = j0; j <= j1; j++) {
          out.push({ i, j, key: tileKey(i, j), dist: Math.abs(i - ci) + Math.abs(j - cj) });
        }
      }
      return out.sort((a, b) => a.dist - b.dist);
    }

    function centerTileKey() {
      const c = map.getCenter();
      return tileKey(latToTile(c.lat), lonToTile(c.lng));
    }

    // Rimuove dalla mappa ciò che appartiene a tessere non più visibili, per
    // evitare che la mappa accumuli all'infinito elementi durante il pan.
    function pruneOutsideTiles(keepKeys) {
      idToLayer.forEach((entry, uniqueId) => {
        if (!keepKeys.has(entry.tile)) {
          entry.group.removeLayer(entry.layer);
          idToLayer.delete(uniqueId);
          loadedIds.delete(uniqueId);
        }
      });
    }

    // Disegna subito, senza rete, tutto ciò che è già in cache per la vista
    function showCachedForView() {
      if (map.getZoom() < MIN_DATA_ZOOM) return;
      const tiles = tilesForView();
      pruneOutsideTiles(new Set(tiles.map(t => t.key)));
      tiles.forEach(t => {
        const data = getTile(t.key);
        if (data) renderParking(data.elements, t.key);
      });
    }

    function loadVisibleTiles() {
      if (map.getZoom() < MIN_DATA_ZOOM) { blockQueue = []; updateLoadingUi(); return; }
      // Prima di scegliere la fonte serve sapere quali zone hanno i dati
      // statici (richiamata da sola appena l'indice è arrivato)
      if (!staticIndexSettled) return;

      let missing = tilesForView().filter(t => !inflightTiles.has(t.key) && !isTileFresh(getTile(t.key)));

      // Tessere coperte dai dati statici: una richiesta per cella, tutte in
      // parallelo (file statici da CDN, nessun limite come per Overpass)
      if (staticIndex) {
        const cells = new Set();
        missing = missing.filter(t => {
          const ck = cellKeyOfTile(t.i, t.j);
          if (!staticIndex.covered.has(ck)) return true;
          cells.add(ck);
          return false;
        });
        cells.forEach(fetchStaticCell);
      }

      // Se manca la tessera al centro (zona mai vista) la si chiede da sola e
      // per prima: query molto più leggera, quindi primi dati prima possibile.
      const firstBlocks = [];
      if (missing.length > 1 && missing[0].dist === 0 && !getTile(missing[0].key)) {
        firstBlocks.push({ tiles: [missing.shift()], dist: -1 });
      }

      // Raggruppa le tessere mancanti in blocchi BLOCK_SIZE x BLOCK_SIZE allineati alla griglia
      const blocks = new Map();
      missing.forEach(t => {
        const bk = Math.floor(t.i / BLOCK_SIZE) + ':' + Math.floor(t.j / BLOCK_SIZE);
        if (!blocks.has(bk)) blocks.set(bk, { tiles: [], dist: t.dist });
        const block = blocks.get(bk);
        block.tiles.push(t);
        block.dist = Math.min(block.dist, t.dist);
      });

      // La coda viene ricostruita a ogni spostamento: i blocchi usciti dalla vista si scartano
      blockQueue = firstBlocks.concat([...blocks.values()].sort((a, b) => a.dist - b.dist));
      pumpBlockQueue();
      updateLoadingUi();
    }

    function pumpBlockQueue() {
      while (activeBlocks < MAX_PARALLEL_BLOCKS && blockQueue.length) {
        fetchBlock(blockQueue.shift());
      }
    }

    function buildParkingQuery(s, w, n, e) {
      return `[out:json][timeout:25][bbox:${s},${w},${n},${e}];(
        way["amenity"="parking"];
        relation["amenity"="parking"];
        node["amenity"="parking"];

        node["amenity"="parking_space"]["parking_space"]["parking_space"!="normal"];
        way["amenity"="parking_space"]["parking_space"]["parking_space"!="normal"];

        node["amenity"="vending_machine"]["vending"="parking_tickets"];
        way["amenity"="vending_machine"]["vending"="parking_tickets"];
        relation["amenity"="vending_machine"]["vending"="parking_tickets"];
      );out body geom qt;`;
    }

    // ─── Postpass (Geofabrik/FOSSGIS): fonte principale fuori dai dati statici ───
    // Database PostGIS di tutto il mondo aggiornato al minuto, interrogabile in
    // SQL dal browser: risponde in 0.2-0.8 s anche dove i mirror Overpass sono
    // fermi. Overpass resta come riserva se Postpass non risponde.
    const POSTPASS_URL = 'https://postpass.geofabrik.de/api/interpreter';
    const POSTPASS_LABEL = 'postpass.geofabrik.de';
    const POSTPASS_TIMEOUT_MS = 12000;
    const OSM_TYPE_NAMES = { N: 'node', W: 'way', R: 'relation' };

    function postpassParkingSql(s, w, n, e) {
      // "<> 'normal'" esclude anche gli stalli senza parking_space (NULL)
      return `SELECT osm_type, osm_id, tags, geom FROM postpass_pointlinepolygon WHERE (` +
        `tags->>'amenity' = 'parking' OR ` +
        `(tags->>'amenity' = 'parking_space' AND tags->>'parking_space' <> 'normal') OR ` +
        `(tags->>'amenity' = 'vending_machine' AND tags->>'vending' = 'parking_tickets')` +
        `) AND geom && ST_MakeEnvelope(${w},${s},${e},${n},4326)`;
    }

    async function fetchPostpass(sql, externalSignal) {
      overpassDiagState[POSTPASS_LABEL] = 'loading';
      updateDiagCell(POSTPASS_LABEL);
      try {
        const res = await fetch(POSTPASS_URL, {
          method: 'POST',
          headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
          body: 'data=' + encodeURIComponent(sql),
          signal: combineSignals(externalSignal, AbortSignal.timeout(POSTPASS_TIMEOUT_MS))
        });
        overpassDiagReachable[POSTPASS_LABEL] = true;
        updateDiagReach(POSTPASS_LABEL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();
        overpassDiagState[POSTPASS_LABEL] = 'success';
        updateDiagCell(POSTPASS_LABEL);
        return data;
      } catch (err) {
        overpassDiagState[POSTPASS_LABEL] = 'failed';
        updateDiagCell(POSTPASS_LABEL);
        throw err;
      }
    }

    // GeoJSON di Postpass -> stesso formato degli elementi Overpass usato dal render.
    // Dei multipoligoni (relazioni) si disegna l'anello esterno più grande.
    function postpassToElements(fc) {
      return (fc.features || []).map(f => {
        const p = f.properties || {}, g = f.geometry;
        if (!g || p.osm_id == null) return null;
        const el = { type: OSM_TYPE_NAMES[p.osm_type] || 'way', id: p.osm_id, tags: p.tags || {} };
        if (g.type === 'Point') {
          el.lat = g.coordinates[1];
          el.lon = g.coordinates[0];
          return el;
        }
        let ring = null;
        if (g.type === 'LineString') ring = g.coordinates;
        else if (g.type === 'Polygon') ring = g.coordinates[0];
        else if (g.type === 'MultiPolygon') {
          g.coordinates.forEach(poly => { if (!ring || poly[0].length > ring.length) ring = poly[0]; });
        }
        if (!ring || ring.length < 2) return null;
        el.geometry = ring.map(c => ({ lat: c[1], lon: c[0] }));
        return el;
      }).filter(Boolean);
    }

    async function fetchBlock(block) {
      const gen = loadGeneration;
      const rect = {
        i0: Math.min(...block.tiles.map(t => t.i)), i1: Math.max(...block.tiles.map(t => t.i)),
        j0: Math.min(...block.tiles.map(t => t.j)), j1: Math.max(...block.tiles.map(t => t.j))
      };
      const rectKeys = [];
      for (let i = rect.i0; i <= rect.i1; i++) for (let j = rect.j0; j <= rect.j1; j++) rectKeys.push(tileKey(i, j));

      rectKeys.forEach(k => inflightTiles.add(k));
      activeBlocks++;
      updateLoadingUi();

      const bbox = [
        (rect.i0 * TILE_DEG).toFixed(4), (rect.j0 * TILE_DEG).toFixed(4),
        ((rect.i1 + 1) * TILE_DEG).toFixed(4), ((rect.j1 + 1) * TILE_DEG).toFixed(4)
      ];
      const controller = new AbortController();
      inflightControllers.add(controller);

      try {
        let fromPostpass = null;
        try {
          fromPostpass = postpassToElements(await fetchPostpass(postpassParkingSql(...bbox), controller.signal));
        } catch (err) {
          if (controller.signal.aborted) throw err; // "Aggiorna": risposta da scartare
          console.warn('Postpass non disponibile, uso Overpass:', err.message);
        }
        if (fromPostpass) {
          if (gen === loadGeneration) {
            applyBlockData({ elements: fromPostpass }, rect, true);
            consecutiveFailures = 0;
          }
          return;
        }

        const query = buildParkingQuery(...bbox);
        let lastRendered = null, settled = false;
        const data = await fetchOverpassRace(query, controller.signal, (partial) => {
          // Mostra subito il primo dato utile; renderParking è additivo, quindi
          // un risultato migliore (anche arrivato in ritardo da un mirror
          // lento) aggiunge solo la differenza e, a caricamento concluso,
          // sostituisce anche la copia salvata.
          if (gen !== loadGeneration) return;
          applyBlockData(partial, rect, settled);
          lastRendered = partial;
        });
        settled = true;
        if (gen === loadGeneration) {
          if (data !== lastRendered) applyBlockData(data, rect, false);
          persistTiles(rectKeys.map(k => [k, tileStore.get(k)]));
          consecutiveFailures = 0;
        }
      } catch (err) {
        if (err.name !== 'AbortError' && gen === loadGeneration) {
          console.warn('Errore fetch:', err);
          // I mirror pubblici sono spesso sovraccarichi per brevi periodi:
          // si riprova da soli qualche volta, con attesa crescente.
          if (consecutiveFailures < MAX_AUTO_RETRIES) {
            consecutiveFailures++;
            clearTimeout(retryTimer);
            retryTimer = setTimeout(loadVisibleTiles, 2000 * consecutiveFailures);
          } else {
            reportLoadError();
          }
        }
      } finally {
        inflightControllers.delete(controller);
        rectKeys.forEach(k => inflightTiles.delete(k));
        activeBlocks--;
        pumpBlockQueue();
        updateLoadingUi();
      }
    }

    function elementPosition(el) {
      if (el.lat != null) return { lat: el.lat, lon: el.lon };
      if (el.bounds) return { lat: (el.bounds.minlat + el.bounds.maxlat) / 2, lon: (el.bounds.minlon + el.bounds.maxlon) / 2 };
      if (el.geometry && el.geometry.length && el.geometry[0].lat != null) return el.geometry[0];
      return null;
    }

    // Distribuisce gli elementi di una risposta nelle tessere del rettangolo
    // richiesto (anche le tessere vuote vengono salvate: "qui non c'è nulla"
    // è un dato utile quanto gli altri) e disegna quelle visibili.
    function applyBlockData(data, rect, persist) {
      const buckets = new Map();
      for (let i = rect.i0; i <= rect.i1; i++) for (let j = rect.j0; j <= rect.j1; j++) buckets.set(tileKey(i, j), []);

      (data.elements || []).forEach(el => {
        const pos = elementPosition(el);
        // Gli elementi a cavallo del bordo finiscono nella tessera più vicina del rettangolo
        const i = Math.min(rect.i1, Math.max(rect.i0, pos ? latToTile(pos.lat) : rect.i0));
        const j = Math.min(rect.j1, Math.max(rect.j0, pos ? lonToTile(pos.lon) : rect.j0));
        // Solo i campi usati dal render: niente liste di nodi/membri, la cache resta leggera
        buckets.get(tileKey(i, j)).push({ type: el.type, id: el.id, tags: el.tags, lat: el.lat, lon: el.lon, geometry: el.geometry });
      });

      const ts = Date.now();
      buckets.forEach((elements, key) => tileStore.set(key, { ts, elements }));
      if (persist) persistTiles([...buckets.keys()].map(k => [k, tileStore.get(k)]));

      // Toglie dalla mappa gli elementi di queste tessere che nei dati nuovi
      // non ci sono più (es. rimossi su OSM); quelli ancora presenti restano
      // dove sono, senza sfarfallio né chiudere un popup aperto.
      const freshIds = new Set();
      buckets.forEach(elements => elements.forEach(el => freshIds.add(el.type + ':' + el.id)));
      idToLayer.forEach((entry, uniqueId) => {
        if (buckets.has(entry.tile) && !freshIds.has(uniqueId)) {
          entry.group.removeLayer(entry.layer);
          idToLayer.delete(uniqueId);
          loadedIds.delete(uniqueId);
        }
      });

      const visible = new Set(tilesForView().map(t => t.key));
      buckets.forEach((elements, key) => { if (visible.has(key)) renderParking(elements, key); });
    }

    // Messaggio "Caricamento..." solo se la zona al centro è ancora vuota: se
    // ci sono dati in cache l'aggiornamento avviene in silenzio (gira solo
    // l'icona del pulsante "Aggiorna").
    let loadingStatusShown = false;
    function updateLoadingUi() {
      const loading = activeBlocks + activeStaticCells > 0;
      document.getElementById('refreshBtn').classList.toggle('loading', loading);
      if (loading && (loadingStatusShown || !getTile(centerTileKey()))) {
        if (!loadingStatusShown) { setStatus('Caricamento parcheggi...'); loadingStatusShown = true; }
      } else if (loadingStatusShown) {
        setStatus('');
        loadingStatusShown = false;
      }
    }

    function reportLoadError() {
      if (getTile(centerTileKey())) return; // si continua a mostrare la cache, anche se vecchia
      loadingStatusShown = false;
      setStatus('Errore connessione. Riprova più tardi.');
      setTimeout(() => setStatus(''), 3000);
    }

    function renderParking(elements, tile) {
      if (!elements || !elements.length) return;

      elements.forEach(el => {
        // Creiamo un ID univoco per OSM (tipo + id)
        var uniqueId = el.type + ':' + el.id;

        // Se lo abbiamo già disegnato, saltiamo (per evitare duplicati/sovrapposizioni)
        if (loadedIds.has(uniqueId)) return;

        // Aggiungiamo l'ID al registro
        loadedIds.add(uniqueId);

        var tags = el.tags || {};
        var osmMeta = { type: el.type, id: el.id };

        // I popup sono costruiti solo quando vengono aperti (bindPopup con
        // funzione), non per ogni elemento al caricamento: con centinaia di
        // elementi il render iniziale è molto più rapido.

        /* ===== Aree di sosta ===== */
        if (tags.amenity === 'parking') {
          var color, fillColor;
          var fee = tags.fee || '', cond = tags['parking:condition'] || '';
          var accessVal = tags.access || '';
          var vehicleVal = tags.vehicle || '';

          var maxstay = (tags.maxstay || '').toString().trim();
          var maxstayLc = maxstay.toLowerCase();
          var hasMaxstay = !!maxstay && !['no','none','unlimited','0'].includes(maxstayLc);
          var hasMaxstayConditional = !!tags['maxstay:conditional'];
          var hasDisc = ((cond || '').toLowerCase().includes('disc')) || hasMaxstay || hasMaxstayConditional;

          if (['private','customers','destination','permit'].includes(accessVal) || vehicleVal === 'permit') {
            color = '#ea580c'; fillColor = '#fb923c';
          } else if (fee === 'yes' || fee === 'conditional' || tags['fee:conditional']) {
            color = '#1d4ed8'; fillColor = '#60a5fa';
          } else if (hasDisc) {
            color = '#7c3aed'; fillColor = '#a78bfa';
          } else if (fee === 'no') {
            color = '#15803d'; fillColor = '#4ade80';
          } else {
            color = '#64748b'; fillColor = '#94a3b8';
          }

          if (el.geometry) {
            let pts = el.geometry.map(g => [g.lat, g.lon]);
            let layer = (pts[0][0] === pts[pts.length-1][0] && pts.length > 2) ?
              L.polygon(pts, { color, weight: 2, fillColor, fillOpacity: 0.4, pane: 'parkingAreasPane' }) :
              L.polyline(pts, { color, weight: 3, pane: 'parkingAreasPane' });

            layer.bindPopup(() => buildPopupContent(tags, pts[0][0], pts[0][1], osmMeta)).addTo(parkingAreasLayer);
            idToLayer.set(uniqueId, { layer, group: parkingAreasLayer, tile });
          } else if (el.lat) {
            let layer = L.circleMarker([el.lat, el.lon], { radius: 7, color, fillColor, fillOpacity: 0.7, pane: 'parkingAreasPane' })
              .bindPopup(() => buildPopupContent(tags, el.lat, el.lon, osmMeta)).addTo(parkingAreasLayer);
            idToLayer.set(uniqueId, { layer, group: parkingAreasLayer, tile });
          }
        }

        /* ===== Stalli speciali ===== */
        if (tags.amenity === 'parking_space' && tags.parking_space !== 'normal') {
          var cPs, fPs, ps = tags.parking_space;
          if (ps === 'disabled') { cPs = '#eab308'; fPs = '#fde047'; }
          else if (ps === 'charging') { cPs = '#0284c7'; fPs = '#f0f9ff'; }
          else if (['emergency','police'].includes(ps)) { cPs = '#1e40af'; fPs = '#60a5fa'; }
          else if (ps === 'motorcycle') { cPs = '#dc2626'; fPs = '#fca5a5'; }
          else if (['delivery','loading','hgv'].includes(ps)) { cPs = '#d97706'; fPs = '#fed7aa'; }
          else if (['parent','women'].includes(ps)) { cPs = '#db2777'; fPs = '#fbcfe8'; }
          else if (ps === 'bus') { cPs = '#0e7490'; fPs = '#67e8f9'; }
          else { cPs = '#374151'; fPs = '#6b7280'; }

          if (el.geometry) {
            let pts2 = el.geometry.map(g => [g.lat, g.lon]);
            let layer2 = L.polygon(pts2, { color: cPs, weight: 2, fillColor: fPs, fillOpacity: 0.8, pane: 'parkingSpacesPane' })
              .bindPopup(() => buildPopupContent(tags, pts2[0][0], pts2[0][1], osmMeta)).addTo(parkingSpacesLayer);
            idToLayer.set(uniqueId, { layer: layer2, group: parkingSpacesLayer, tile });
          } else if (el.lat) {
            let layer2 = L.circleMarker([el.lat, el.lon], { radius: 8, color: cPs, fillColor: fPs, fillOpacity: 0.9, pane: 'parkingSpacesPane' })
              .bindPopup(() => buildPopupContent(tags, el.lat, el.lon, osmMeta)).addTo(parkingSpacesLayer);
            idToLayer.set(uniqueId, { layer: layer2, group: parkingSpacesLayer, tile });
          }
        }

        /* ===== Parcometri ===== */
        if (tags.amenity === 'vending_machine' && tags.vending === 'parking_tickets') {
          let lat = el.lat;
          let lon = el.lon;

          if ((lat == null || lon == null) && el.geometry && el.geometry.length) {
            lat = el.geometry[0].lat;
            lon = el.geometry[0].lon;
          }
          if (lat != null && lon != null) {
            var meterLayer = L.circleMarker([lat, lon], {
              radius: 5,
              color: METER_STROKE,
              weight: 2,
              fillColor: METER_FILL,
              fillOpacity: 0.95,
              pane: 'parkometersPane'
            }).bindPopup(() => buildParkingMeterPopup(tags, lat, lon, osmMeta))
              .addTo(parkometersLayer);
            idToLayer.set(uniqueId, { layer: meterLayer, group: parkometersLayer, tile });
          }
        }
      });
    }

    // Letti una volta sola: getComputedStyle per ogni parcometro rallentava il render
    const rootStyle = getComputedStyle(document.documentElement);
    const METER_STROKE = rootStyle.getPropertyValue('--meter-stroke').trim() || '#111827';
    const METER_FILL = rootStyle.getPropertyValue('--meter-fill').trim() || '#f97316';

    function saveLastView() {
      try {
        const c = map.getCenter();
        localStorage.setItem(LAST_VIEW_KEY, JSON.stringify({ lat: +c.lat.toFixed(5), lon: +c.lng.toFixed(5), z: map.getZoom() }));
      } catch (err) {}
    }

    var fetchTimeout = null;
    map.on('moveend', () => {
      saveLastView();
      showCachedForView(); // istantaneo, dalla cache
      if (fetchTimeout) clearTimeout(fetchTimeout);
      fetchTimeout = setTimeout(loadVisibleTiles, 100);
    });

    // Anche DURANTE il trascinamento (al massimo ogni 300 ms): si disegna ciò
    // che è in cache per la zona che sta entrando e si avviano i download,
    // senza aspettare che l'utente rilasci il dito.
    var lastMoveLoad = 0;
    map.on('move', () => {
      const now = Date.now();
      if (now - lastMoveLoad < 300) return;
      lastMoveLoad = now;
      showCachedForView();
      if (initialLoadDone) loadVisibleTiles();
    });

    showCachedForView();

    // Al primo avvio con GPS si aspetta (poco) la posizione prima di scaricare,
    // per non sprecare una richiesta sulla vista iniziale che verrebbe subito
    // abbandonata. Il primo fix GPS (o il suo errore) anticipa il caricamento.
    let initialLoadDone = false;
    function triggerInitialLoad() {
      if (initialLoadDone) return;
      initialLoadDone = true;
      clearTimeout(initialLoadTimer);
      loadVisibleTiles();
    }
    const initialLoadTimer = setTimeout(triggerInitialLoad, hasSharedView ? 0 : 1500);

    function showSearchResults(items) {
      const box = document.getElementById('searchResults');
      if (!items.length) {
        box.style.display = 'none';
        box.innerHTML = '';
        return;
      }

      box.innerHTML = items.map((r, i) => {
        return `<div class="search-result-item" data-lat="${r.lat}" data-lon="${r.lon}">
                  ${i+1}) ${escapeHtml(r.display_name)}
                </div>`;
      }).join('');
      box.style.display = 'block';

      box.querySelectorAll('.search-result-item').forEach(el => {
        el.onclick = () => {
          map.setView([parseFloat(el.dataset.lat), parseFloat(el.dataset.lon)], 17);
          showSearchResults([]);
          setStatus('Posizione aggiornata');
        };
      });
    }

    // ─── Ricerca località (tutto il mondo) ───
    // Prima si cercano i nodi OSM reali vicini alla zona visualizzata (Postpass,
    // 0.2 s), poi Nominatim su tutto il mondo. I risultati vicini vengono prima:
    // "Valencia" cercata dall'Italia porta comunque in Spagna, ma tra due
    // omonimi vince quello più vicino.

    // Riquadro di ±deg gradi attorno al centro della mappa, per le ricerche "vicine"
    function boxAroundView(deg) {
      const c = map.getCenter();
      return {
        s: Math.max(-90, c.lat - deg), n: Math.min(90, c.lat + deg),
        w: Math.max(-180, c.lng - deg), e: Math.min(180, c.lng + deg)
      };
    }

    function sqlString(s) { return "'" + String(s).replace(/'/g, "''") + "'"; }

    function distanceFromView(lat, lon) { return map.distance(map.getCenter(), L.latLng(lat, lon)); }

    // Nodi OSM (tabella punti di Postpass) che soddisfano `where` dentro il riquadro
    async function postpassPoints(where, box, limit, timeoutMs) {
      const sql = `SELECT osm_type, osm_id, tags, geom FROM postpass_point WHERE ${where} ` +
        `AND geom && ST_MakeEnvelope(${box.w},${box.s},${box.e},${box.n},4326) LIMIT ${limit}`;
      const res = await fetch(POSTPASS_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
        body: 'data=' + encodeURIComponent(sql),
        signal: AbortSignal.timeout(timeoutMs)
      });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const fc = await res.json();
      return (fc.features || [])
        .filter(f => f.geometry && f.geometry.type === 'Point')
        .map(f => ({ lat: f.geometry.coordinates[1], lon: f.geometry.coordinates[0], tags: f.properties.tags || {} }));
    }

    async function nominatimSearch(params) {
      const url = 'https://nominatim.openstreetmap.org/search?format=json&addressdetails=1&' + params;
      const res = await fetch(url, { headers: { 'Accept-Language': navigator.language || 'it' } });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      return res.json();
    }

    // Codice postale: il nodo OSM reale più vicino (postal_code / addr:postcode),
    // non il centroide calcolato da Nominatim sull'area del CAP; se nei dintorni
    // non c'è, Nominatim in tutto il mondo (es. un CAP francese cercato dall'Italia).
    async function geocodePostcode(code) {
      const worldwide = nominatimSearch('postalcode=' + encodeURIComponent(code) + '&limit=10').catch(() => []);
      const nearby = postpassPoints(
        `(tags->>'postal_code' = ${sqlString(code)} OR tags->>'addr:postcode' = ${sqlString(code)})`,
        boxAroundView(3), 5, 5000
      ).catch(err => { console.warn('Ricerca CAP vicina non riuscita:', err.message); return []; });

      // Il nodo reale vicino ha la precedenza, ma se nei dintorni il CAP non
      // esiste (es. un CAP francese cercato dall'Italia) non lo si aspetta fino
      // al timeout: al massimo 1.5 s in più rispetto alla risposta di Nominatim.
      await worldwide;
      const near = await Promise.race([nearby, new Promise(r => setTimeout(() => r([]), 1500))]);

      if (near.length) {
        near.sort((a, b) => distanceFromView(a.lat, a.lon) - distanceFromView(b.lat, b.lon));
        map.setView([near[0].lat, near[0].lon], 15);
        setStatus('CAP trovato');
        setTimeout(() => setStatus(''), 1200);
        return true;
      }

      const results = (await worldwide).map(r => {
        const a = r.address || {};
        return {
          lat: +r.lat, lon: +r.lon,
          name: code,
          display_name: [code, a.city || a.town || a.village || a.county, a.country].filter(Boolean).join(', ')
        };
      }).sort((a, b) => distanceFromView(a.lat, a.lon) - distanceFromView(b.lat, b.lon));

      if (!results.length) return false;
      if (results.length === 1) {
        map.setView([results[0].lat, results[0].lon], 15);
        setStatus('CAP trovato');
        setTimeout(() => setStatus(''), 1200);
      } else {
        showSearchResults(results.slice(0, 6));
        setStatus('Seleziona un risultato');
      }
      return true;
    }

    const placeTypeLabels = {
      city: 'Città', town: 'Comune', village: 'Paese', hamlet: 'Frazione',
      suburb: 'Quartiere', municipality: 'Comune', borough: 'Quartiere', locality: 'Località'
    };

    // Le preposizioni italiane restano minuscole nel "Title Case" (es. "Castiglione delle Stiviere")
    const ITALIAN_LOWER_WORDS = new Set(['di','del','della','dei','delle','dello','d','a','al','allo','alla','agli','alle','sul','sulla','sui','e','in','l']);
    function toItalianTitleCase(q) {
      return q.trim().split(/\s+/).map((w, i) => {
        if (i > 0 && ITALIAN_LOWER_WORDS.has(w.toLowerCase())) return w.toLowerCase();
        return w.charAt(0).toUpperCase() + w.slice(1).toLowerCase();
      }).join(' ');
    }

    // Nodo OSM reale place=* con il nome esatto, entro ~600 km dalla zona visualizzata
    // (es. https://www.openstreetmap.org/node/64778671): risponde in ~0.2 s.
    async function geocodeExactPlaceNode(q) {
      const names = [...new Set([q.trim(), toItalianTitleCase(q)])].map(sqlString).join(',');
      try {
        const points = await postpassPoints(`tags ? 'place' AND tags->>'name' IN (${names})`, boxAroundView(6), 10, 5000);
        return points
          .sort((a, b) => distanceFromView(a.lat, a.lon) - distanceFromView(b.lat, b.lon))
          .map(p => ({
            lat: p.lat,
            lon: p.lon,
            name: p.tags.name,
            display_name: p.tags.name + (placeTypeLabels[p.tags.place] ? ` (${placeTypeLabels[p.tags.place]})` : '')
          }));
      } catch (err) {
        console.warn('Errore ricerca nodo esatto:', err);
        return [];
      }
    }

    // Nominatim su tutto il mondo. Per alcune città importanti il nodo place=* viene
    // "assorbito" nel confine amministrativo, quindi si accettano anche i boundary.
    async function geocodePlaceWorldwide(q) {
      try {
        const results = await nominatimSearch('q=' + encodeURIComponent(q) + '&limit=25');
        if (!results || !results.length) return [];
        const qLower = q.trim().toLowerCase();

        return results
          .filter(r => (r.class === 'place' && placeTypeLabels[r.type]) ||
                       (r.class === 'boundary' && r.type === 'administrative'))
          .map(r => {
            const name = (r.display_name.split(',')[0] || '').trim();
            const label = placeTypeLabels[r.type] || (r.addresstype ? placeTypeLabels[r.addresstype] : null);
            const country = r.address && r.address.country;
            return {
              lat: +r.lat,
              lon: +r.lon,
              name,
              display_name: (label ? `${name} (${label})` : name) + (country ? `, ${country}` : '')
            };
          })
          // Il nome identico alla ricerca prima delle frazioni omonime, poi i più vicini
          .sort((a, b) =>
            ((a.name.toLowerCase() === qLower ? 0 : 1) - (b.name.toLowerCase() === qLower ? 0 : 1)) ||
            (distanceFromView(a.lat, a.lon) - distanceFromView(b.lat, b.lon)))
          .slice(0, 6);
      } catch (err) {
        console.warn('Errore ricerca città:', err);
        return [];
      }
    }

    async function geocode(q) {
      if (!q) return;

      showSearchResults([]);
      setStatus('Cerco località...');

      // Codici postali numerici (IT, FR, DE, ES, US: 5 cifre; CH, AT, BE...: 4; ecc.)
      if (/^\d{4,6}$/.test(q)) {
        if (await geocodePostcode(q)) return;
        setStatus('CAP non trovato su OSM');
        return;
      }

      // Vicino (Postpass) e mondo (Nominatim) in parallelo: si mostra il vicino
      // se c'è, altrimenti il risultato mondiale, senza attendere due volte.
      const worldwide = geocodePlaceWorldwide(q);
      let placeResults = await geocodeExactPlaceNode(q);
      if (!placeResults.length) placeResults = await worldwide;
      if (!placeResults.length) { setStatus('Nessun risultato'); return; }

      showSearchResults(placeResults.slice(0, 6));
      setStatus('Seleziona un risultato');
    }

    document.getElementById('searchBtn').onclick = () => geocode(document.getElementById('searchInput').value.trim());
    document.getElementById('searchInput').onkeydown = (e) => {
      if (e.key === 'Enter') geocode(e.target.value.trim());
    };

    document.addEventListener('click', (e) => {
      const box = document.getElementById('searchResults');
      const sb = document.getElementById('searchBox');
      if (box.style.display === 'block' && !sb.contains(e.target)) showSearchResults([]);
    });

    /* ===== Posizione utente: pallino blu pulsante + cerchio di precisione ===== */
    const gpsBtnEl = document.getElementById('gpsBtn');
    const userLocIcon = L.divIcon({
      className: 'user-loc-icon',
      html: '<div class="user-loc"><div class="user-loc-pulse"></div><div class="user-loc-dot"></div></div>',
      iconSize: [18, 18],
      iconAnchor: [9, 9]
    });
    let userMarker = null, userAccuracyCircle = null, lastFix = null;
    let geoWatchId = null, centerOnNextFix = false;

    function onUserPosition(p) {
      const ll = [p.coords.latitude, p.coords.longitude];
      const acc = p.coords.accuracy || 0;
      // Un fix approssimativo arrivato dopo uno più preciso non deve peggiorare il pallino
      if (lastFix && acc > lastFix.acc * 2 && Date.now() - lastFix.ts < 15000) return;
      lastFix = { ll, acc, ts: Date.now() };

      if (!userMarker) {
        userAccuracyCircle = L.circle(ll, {
          radius: acc, pane: 'userLocationPane', interactive: false,
          color: '#2563eb', weight: 1, opacity: 0.35, fillColor: '#3b82f6', fillOpacity: 0.12
        }).addTo(map);
        userMarker = L.marker(ll, { icon: userLocIcon, pane: 'userLocationPane', interactive: false, keyboard: false }).addTo(map);
      } else {
        userMarker.setLatLng(ll);
        userAccuracyCircle.setLatLng(ll).setRadius(acc);
      }
      gpsBtnEl.classList.add('active');

      if (centerOnNextFix) {
        centerOnNextFix = false;
        map.setView(ll, Math.max(map.getZoom(), 17));
        setStatus('Posizione trovata');
        setTimeout(() => setStatus(''), 1200);
      }
      triggerInitialLoad();
    }

    function onUserPositionError(err) {
      if (centerOnNextFix) {
        centerOnNextFix = false;
        setStatus(err && err.code === 1 ? 'Permesso posizione negato' : 'Posizione non disponibile');
        setTimeout(() => setStatus(''), 2500);
      }
      if (err && err.code === 1) {
        // Permesso negato: il watch non riceverà più nulla, lo si riavvia al prossimo click
        if (geoWatchId != null) navigator.geolocation.clearWatch(geoWatchId);
        geoWatchId = null;
        gpsBtnEl.classList.remove('active');
      }
      triggerInitialLoad();
    }

    function startWatchingPosition() {
      if (geoWatchId != null) return;
      // Fix rapido (anche approssimativo o di qualche minuto fa) per centrare
      // subito la mappa; il watch ad alta precisione poi lo affina e tiene il
      // pallino aggiornato mentre ci si sposta.
      navigator.geolocation.getCurrentPosition(onUserPosition, () => {},
        { enableHighAccuracy: false, maximumAge: 5 * 60 * 1000, timeout: 4000 });
      geoWatchId = navigator.geolocation.watchPosition(onUserPosition, onUserPositionError,
        { enableHighAccuracy: true, maximumAge: 10000, timeout: 20000 });
    }

    function locateUser() {
      if (!navigator.geolocation) {
        setStatus('GPS non disponibile');
        triggerInitialLoad();
        return;
      }
      // Posizione già nota e recente: si centra all'istante, senza attese
      if (lastFix && Date.now() - lastFix.ts < 30000) {
        map.setView(lastFix.ll, Math.max(map.getZoom(), 17));
      } else {
        centerOnNextFix = true;
        setStatus('Cerco la tua posizione...');
      }
      startWatchingPosition();
    }

    // 1. Collega la funzione al click del pulsante (così puoi usarlo sempre)
    gpsBtnEl.onclick = locateUser;

    // 2. Chiama la funzione SUBITO all'avvio (appena apri il sito), a meno che
    // l'app non sia stata aperta da un link condiviso: in quel caso l'utente
    // vuole vedere PROPRIO quella posizione, non la propria (la sovrascriverebbe).
    // Il pallino compare comunque, ma la mappa resta sulla posizione condivisa.
    if (!hasSharedView) locateUser();
    else if (navigator.geolocation) startWatchingPosition();

    /* ===== Condividi posizione ===== */
    function buildShareUrl() {
      const c = map.getCenter();
      // Dall'app il link deve aprire il sito pubblico, non l'indirizzo interno dell'APK
      const url = new URL(IS_NATIVE_APP ? PUBLIC_SITE_URL : window.location.href);
      url.hash = '';
      url.searchParams.set('lat', c.lat.toFixed(6));
      url.searchParams.set('lon', c.lng.toFixed(6));
      url.searchParams.set('z', map.getZoom());
      return url.toString();
    }

    function promptCopyUrl(url) {
      window.prompt('Copia il link:', url);
    }

    function copyShareUrl(url) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(() => {
          setStatus('Link copiato negli appunti');
          setTimeout(() => setStatus(''), 1800);
        }).catch(() => promptCopyUrl(url));
      } else {
        promptCopyUrl(url);
      }
    }

    async function shareCurrentView() {
      const url = buildShareUrl();

      // Web Share API (mobile): apre il menu di condivisione nativo del
      // sistema. Se non disponibile (es. desktop), fallback su clipboard.
      if (navigator.share) {
        try {
          await navigator.share({ title: 'ParkMap', text: 'Guarda questa posizione su ParkMap', url });
          return;
        } catch (err) {
          if (err.name === 'AbortError') return; // utente ha annullato la condivisione
          // Qualunque altro errore (es. share non permesso in questo contesto): fallback su copia.
        }
      }
      copyShareUrl(url);
    }

    document.getElementById('shareBtn').onclick = shareCurrentView;


    function refreshAllData() {
      // Annulla i download in corso e scarta le loro risposte
      loadGeneration++;
      inflightControllers.forEach(c => c.abort());
      inflightTiles.clear();
      blockQueue = [];
      consecutiveFailures = 0;

      // Le tessere vengono solo segnate come "vecchie", non cancellate: i dati
      // restano sulla mappa finché quelli nuovi non li sostituiscono, così se
      // i mirror non rispondono non si resta con una mappa vuota.
      tileStore.forEach(t => { t.ts = 0; });
      staticFetchCache = 'no-cache'; // scavalca la cache HTTP: prende l'ultima generazione notturna

      setStatus('Aggiornamento dati...');
      loadingStatusShown = true; // il messaggio sparisce quando arrivano i dati
      loadVisibleTiles();
    }

    /* ===== Pannello diagnostico provider (pressione prolungata su "Aggiorna") ===== */
    function diagIconHtml(state) {
      if (state === 'success') return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#16a34a" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="1.3" opacity="0.3"/><path d="M6 12.5l4 4 8-9"/></svg>';
      if (state === 'failed') return '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#dc2626" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10" stroke-width="1.3" opacity="0.3"/><path d="M8.5 8.5l7 7M15.5 8.5l-7 7"/></svg>';
      if (state === 'loading') return '<svg class="diag-spin" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#64748b" stroke-width="2.5" stroke-linecap="round"><circle cx="12" cy="12" r="9" stroke-dasharray="40 16"/></svg>';
      return '<span style="color:#cbd5e1">—</span>';
    }

    let diagPanelEl = null, diagBackdropEl = null;

    function updateDiagCell(label) {
      if (!diagPanelEl) return;
      const cell = diagPanelEl.querySelector(`.diag-status-cell[data-label="${CSS.escape(label)}"]`);
      if (cell) cell.innerHTML = diagIconHtml(overpassDiagState[label]);
    }

    function updateDiagReach(label) {
      if (!diagPanelEl) return;
      const cell = diagPanelEl.querySelector(`.diag-reach-cell[data-label="${CSS.escape(label)}"]`);
      if (cell) cell.innerHTML = diagIconHtml(overpassDiagReachable[label] === true ? 'success' : (overpassDiagReachable[label] === false ? 'failed' : ''));
    }

    function closeDiagPanel() {
      if (diagPanelEl) { diagPanelEl.remove(); diagPanelEl = null; }
      if (diagBackdropEl) { diagBackdropEl.remove(); diagBackdropEl = null; }
    }

    function openDiagPanel() {
      closeDiagPanel();

      diagBackdropEl = document.createElement('div');
      diagBackdropEl.id = 'diagBackdrop';
      diagBackdropEl.onclick = closeDiagPanel;
      document.body.appendChild(diagBackdropEl);

      const centerTile = getTile(centerTileKey());
      const hasSessionCache = isTileFresh(centerTile);
      const hasPersistentCache = !!centerTile;

      const c = map.getCenter();
      const staticCoversCenter = !!staticIndex && staticIndex.covered.has(cellKeyOfTile(latToTile(c.lat), lonToTile(c.lng)));
      const staticDate = staticIndex && staticIndex.osmTimestamp
        ? new Date(staticIndex.osmTimestamp).toLocaleDateString('it-IT', { day: 'numeric', month: 'short', year: 'numeric' })
        : '';
      const staticLabel = !staticIndex ? 'non disponibili'
        : (staticCoversCenter ? `OSM del ${staticDate}` : 'fuori area (Overpass)');

      const panel = document.createElement('div');
      panel.id = 'diagPanel';
      panel.innerHTML = `
        <div class="diag-header">
          <span>Provider dati OSM</span>
          <button type="button" class="diag-close" aria-label="Chiudi">✕</button>
        </div>
        <div class="diag-table-wrap">
          <table class="diag-table">
            <thead><tr><th>Provider</th><th>Rete</th><th>Query</th></tr></thead>
            <tbody>
              ${[POSTPASS_URL, ...OVERPASS_MIRRORS].map(url => {
                const label = url === POSTPASS_URL ? POSTPASS_LABEL : shortOverpassLabel(url);
                return `<tr>
                  <td class="diag-provider">${escapeHtml(label)}</td>
                  <td class="diag-icon-cell diag-reach-cell" data-label="${escapeHtml(label)}">${diagIconHtml(overpassDiagReachable[label] === true ? 'success' : (overpassDiagReachable[label] === false ? 'failed' : ''))}</td>
                  <td class="diag-icon-cell diag-status-cell" data-label="${escapeHtml(label)}">${diagIconHtml(overpassDiagState[label])}</td>
                </tr>`;
              }).join('')}
            </tbody>
          </table>
        </div>
        <div class="diag-cache-row">
          <span>Cache per questa zona</span>
          <strong style="color:${hasSessionCache || hasPersistentCache ? '#16a34a' : '#94a3b8'}">${hasSessionCache ? 'attiva' : (hasPersistentCache ? 'disponibile' : 'assente')}</strong>
        </div>
        <div class="diag-cache-row">
          <span>Dati precalcolati</span>
          <strong style="color:${staticCoversCenter ? '#16a34a' : '#94a3b8'}">${staticLabel}</strong>
        </div>
        <button type="button" class="diag-run-btn">Aggiorna ora</button>
      `;
      document.body.appendChild(panel);
      diagPanelEl = panel;

      panel.querySelector('.diag-close').onclick = closeDiagPanel;
      panel.querySelector('.diag-run-btn').onclick = () => {
        closeDiagPanel();
        refreshAllData();
      };
    }

    // Pressione prolungata (~600ms) sul pulsante "Aggiorna": apre il pannello
    // diagnostico dei provider invece del refresh normale. Il click "normale"
    // che segue il rilascio prolungato viene soppresso, altrimenti partirebbe
    // anche il refresh vero e proprio insieme all'apertura del pannello.
    const refreshBtnEl = document.getElementById('refreshBtn');
    let refreshPressTimer = null;
    let refreshLongPressed = false;
    const REFRESH_LONG_PRESS_MS = 600;
    const cancelRefreshPress = () => clearTimeout(refreshPressTimer);

    refreshBtnEl.addEventListener('pointerdown', () => {
      refreshLongPressed = false;
      clearTimeout(refreshPressTimer);
      refreshPressTimer = setTimeout(() => {
        refreshLongPressed = true;
        openDiagPanel();
      }, REFRESH_LONG_PRESS_MS);
    });
    refreshBtnEl.addEventListener('pointerup', cancelRefreshPress);
    refreshBtnEl.addEventListener('pointerleave', cancelRefreshPress);
    refreshBtnEl.addEventListener('pointercancel', cancelRefreshPress);

    refreshBtnEl.addEventListener('click', () => {
      if (refreshLongPressed) { refreshLongPressed = false; return; }
      refreshAllData();
    });


    /* ===== Schermo intero ===== */
    function updateFullscreenIcon() {
      const btn = document.getElementById('fullscreenBtn');
      const isFs = !!document.fullscreenElement;

      btn.innerHTML = isFs
        ? '<i data-lucide="minimize-2"></i>'
        : '<i data-lucide="maximize-2"></i>';

      lucide.createIcons({ root: btn });
    }

    function toggleFullscreen() {
      const root = document.documentElement;

      if (!document.fullscreenElement) {
        if (!root.requestFullscreen) {
          setStatus('Schermo intero non supportato');
          return;
        }
        root.requestFullscreen()
          .catch(() => setStatus('Impossibile attivare schermo intero'));
      } else {
        if (document.exitFullscreen) document.exitFullscreen();
      }
    }

    document.getElementById('fullscreenBtn').onclick = toggleFullscreen;

    // Su iOS Safari la Fullscreen API non è supportata: nascondiamo il pulsante
    // invece di mostrarlo senza che faccia nulla.
    // Idem se l'app è già installata come PWA a schermo intero (manifest display:fullscreen):
    // il pulsante sarebbe ridondante e su alcuni browser innescherebbe comunque il banner nativo.
    var runningFullscreenPwa = window.matchMedia('(display-mode: fullscreen)').matches || navigator.standalone;
    if (!document.documentElement.requestFullscreen || runningFullscreenPwa || IS_NATIVE_APP) {
      document.getElementById('fullscreenBtn').style.display = 'none';
    }

    document.addEventListener('fullscreenchange', () => {
      updateFullscreenIcon();
      setTimeout(() => map.invalidateSize(), 200);
    });

    updateFullscreenIcon();
  </script>
</body>
</html>
